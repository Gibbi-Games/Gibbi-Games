<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gibbis</title>
<meta name="description" content="Hatch a Gibbi, raise it, play games together and dress it up. A Gibbi Games original.">
<meta name="theme-color" content="#2B2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gibbis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen toy world. Room is home base (pet on the rug, toybox along the bottom, needs + nest + gear on top). School, nest, fetch and the bus are sibling screens. One committed storybook look, same in light and dark. */
:root{
  --ink:#2B2140;
  --paper:#FFF4DE;
  --wall:#5E9E97;
  --wall-dot:#6CAEA6;
  --floor:#C7874A;
  --floor-line:#B57641;
  --rug:#E8735A;
  --rug-2:#F29A7F;
  --sun:#FFC83D;
  --sky:#A9DCF2;
  --leaf:#4E8F55;
  --mint:#5FD0B8;
  --chalk:#F4F1E6;
  --board:#2F5D50;
  --night:rgba(22,18,64,.62);
  --emo:clamp(40px,11vw,64px);
  --display:"Grandstander","Chalkboard SE","Comic Sans MS",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--display);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;background:var(--wall)}
button{font-family:inherit;font-weight:800;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.screen{position:absolute;inset:0;overflow:hidden;overflow:clip}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg{display:block}

/* ---------- Title ---------- */
#title{background:radial-gradient(circle at 50% 38%, #FFD978 0 18%, transparent 19%), linear-gradient(#FFC83D, #F29A7F);display:flex;align-items:center;justify-content:center}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,28px);width:100%;max-width:560px;padding-block:24px}
.logo{margin:0;font-size:clamp(52px,13vw,104px);font-weight:900;line-height:.9;letter-spacing:-.02em;color:var(--ink);text-align:center}
.logo span{color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.title-egg{width:clamp(110px,26vw,170px);animation:wob 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
#titleActions{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.title-wrap.back .logo{font-size:clamp(40px,9vw,72px)}
.title-egg.has-pet{width:clamp(170px,42vw,280px);aspect-ratio:1;animation:none;cursor:pointer}
.hero-pet{width:100%;height:100%}
.hero-pet svg{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 92%;overflow:visible}
.hero-name{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-8px}
.hero-name b{font-size:clamp(28px,7vw,40px);font-weight:900;line-height:1;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-name span{font-size:16px;font-weight:800;opacity:.7}
.big-play{border:0;border-radius:999px;background:var(--mint);color:var(--ink);font-size:clamp(28px,7vw,38px);font-weight:900;padding:16px 46px 18px 38px;box-shadow:0 8px 0 var(--ink);display:flex;align-items:center;gap:12px;animation:nag 1.6s ease-in-out infinite}
.big-play svg{width:1em;height:1em}
.big-play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink);animation:none}
.big-play:disabled{opacity:.6;animation:none}
.nest-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.nest-mini{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,244,222,.75);padding:4px;position:relative;box-shadow:0 4px 0 rgba(43,33,64,.3)}
.nest-mini svg{width:100%;height:100%;overflow:visible}
.nest-mini.egg svg{width:70%;height:80%;margin:auto}
.install-b{border:0;border-radius:999px;background:var(--paper);font-size:17px;padding:10px 18px;box-shadow:0 4px 0 var(--ink)}
.fam-btns{display:flex;gap:8px;flex-wrap:wrap}
.fam-b{flex:1;min-width:140px;border:0;border-radius:16px;background:var(--mint);padding:12px;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.fam-b.alt{background:#F5E5C4}
.fam-code{width:100%;min-height:72px;margin:8px 0;border-radius:12px;border:2px solid rgba(43,33,64,.25);padding:8px;font:600 12px ui-monospace,monospace;color:var(--ink);background:#fff;word-break:break-all;-webkit-user-select:text;user-select:text}
.save-note{margin:0;font-size:14px;font-weight:700;opacity:.75;text-align:center}
.note.big{font-size:18px;max-width:30ch}
.confirm.wide{width:100%;max-width:420px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.mode-card{border:0;border-radius:28px;background:var(--paper);padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--ink);transition:transform .1s}
.mode-card:active,.play-card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.mode-card svg{width:64px;height:64px}
.mode-card b{font-size:24px;font-weight:900}
.mode-card small{font-size:14px;font-weight:600;opacity:.75}
.play-card{border:0;border-radius:32px;background:var(--paper);padding:14px 28px 14px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 0 var(--ink);max-width:100%}
.play-card .mini{width:84px;height:84px;flex:none}
.play-card .txt{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.play-card b{font-size:30px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.play-card small{font-size:15px;font-weight:600;opacity:.75}
.link-btn{border:0;background:none;font-size:16px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.note{margin:0;font-size:15px;font-weight:600;text-align:center;max-width:36ch}

/* ---------- Hatch ---------- */
#hatch{background:linear-gradient(#A9DCF2 0 62%, #8CC07A 62%)}
.nest-bowl{position:absolute;left:50%;top:66%;width:min(70vw,320px);height:min(18vw,84px);transform:translate(-50%,-50%);border-radius:50%;background:repeating-linear-gradient(20deg,#B9844A 0 6px,#9C6A36 6px 9px,#D2A162 9px 14px);box-shadow:inset 0 -10px 0 rgba(43,33,64,.25)}
.egg-btn{position:absolute;left:50%;top:66%;width:min(40vw,190px);aspect-ratio:120/150;transform:translate(-50%,-92%);border:0;background:none;padding:0;transform-origin:50% 100%}
.egg-btn.tick{animation:tick .28s}
@keyframes tick{0%,100%{transform:translate(-50%,-92%) rotate(0)}30%{transform:translate(-50%,-94%) rotate(-9deg)}65%{transform:translate(-50%,-92%) rotate(8deg)}}
.tap-ring{position:absolute;left:50%;top:50%;width:min(46vw,220px);aspect-ratio:1;border-radius:50%;border:6px solid var(--paper);transform:translate(-50%,-62%);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-62%) scale(.7)}100%{opacity:0;transform:translate(-50%,-62%) scale(1.25)}}
.hatch-pet{position:absolute;left:50%;top:66%;width:min(52vw,240px);aspect-ratio:1;transform:translate(-50%,-88%);pointer-events:none}
.hatch-pet,.nest-bowl{transition:top .5s ease}
#hatch.naming .hatch-pet,#hatch.naming .nest-bowl{top:44%}
.hatch-pet.pop{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{0%{transform:translate(-50%,-40%) scale(.2)}100%{transform:translate(-50%,-88%) scale(1)}}
.scaler{width:100%;height:100%;transform-origin:50% 100%}
.namer{position:absolute;left:0;right:0;bottom:0;padding-block:20px 28px;background:var(--paper);border-radius:32px 32px 0 0;box-shadow:0 -6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:14px;animation:up .4s ease-out both}
@keyframes up{from{transform:translateY(100%)}}
.namer h2{margin:0;font-size:24px;font-weight:900}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.name-b{border:0;border-radius:999px;background:var(--sun);font-size:24px;padding:14px 24px;box-shadow:0 6px 0 var(--ink)}
.name-b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.name-b.alt{background:var(--sky)}
.type-row{display:flex;gap:10px;width:100%;max-width:380px}
.type-row input{flex:1;min-width:0;font-family:inherit;font-size:22px;font-weight:800;padding:12px 16px;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.type-row button{border:0;border-radius:18px;background:var(--mint);font-size:20px;padding:0 20px;box-shadow:0 5px 0 var(--ink)}

/* ---------- Room ---------- */
.layer{position:absolute;will-change:transform}
.wall{left:-40px;right:-40px;top:0;bottom:34%;background:radial-gradient(var(--wall-dot) 20%, transparent 22%) 0 0/38px 38px, var(--wall);transition:filter .6s}
.window{position:absolute;left:calc(40px + 9%);top:16%;width:min(30vw,190px);aspect-ratio:3/4;border-radius:50% 50% 10px 10px / 34% 34% 10px 10px;border:10px solid var(--paper);overflow:hidden;box-shadow:0 8px 0 rgba(43,33,64,.2)}
.sky{position:absolute;inset:0;background:linear-gradient(var(--sky),#E3F4FB);transition:background .8s}
.sun{position:absolute;width:38%;aspect-ratio:1;border-radius:50%;background:var(--sun);right:14%;top:16%;transition:background .8s, box-shadow .8s}
.window::before,.window::after{content:"";position:absolute;background:var(--paper);z-index:1}
.window::before{left:50%;top:0;bottom:0;width:8px;transform:translateX(-50%)}
.window::after{top:52%;left:0;right:0;height:8px}
.shelf{position:absolute;right:calc(40px + 8%);top:30%;width:min(34vw,220px);height:12px;background:var(--floor);border-radius:4px;box-shadow:0 6px 0 rgba(43,33,64,.2)}
.shelf i{position:absolute;bottom:12px;display:block;border-radius:6px 6px 2px 2px}
.shelf i:nth-child(1){left:8%;width:18%;height:44px;background:var(--rug)}
.shelf i:nth-child(2){left:30%;width:14%;height:30px;background:var(--sun)}
.shelf i:nth-child(3){left:50%;width:22%;height:54px;background:var(--paper)}
.shelf i:nth-child(4){left:78%;width:14%;height:24px;background:var(--mint);border-radius:50%}
.floor{left:-40px;right:-40px;bottom:0;height:34%;background:linear-gradient(rgba(43,33,64,.18),transparent 14px),repeating-linear-gradient(90deg,var(--floor) 0 78px,var(--floor-line) 78px 82px)}
.rug{position:absolute;left:50%;top:34%;width:min(86vw,620px);height:44%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center, var(--rug-2) 0 46%, var(--rug) 47% 62%, var(--rug-2) 63% 68%, var(--rug) 69%)}
.basket{position:absolute;right:calc(40px + 3%);top:8%;width:min(30vw,180px);height:min(13vw,74px);border-radius:12px 12px 50% 50%/12px 12px 70% 70%;background:repeating-linear-gradient(90deg,#9C6A36 0 10px,#B9844A 10px 20px);box-shadow:inset 0 10px 0 #E9D3F5}
.fore{left:-60px;right:-60px;bottom:0;height:0}
.plant{position:absolute;left:calc(60px - 2%);bottom:0;width:min(20vw,120px);height:min(30vw,170px)}
.plant::before{content:"";position:absolute;left:18%;right:18%;bottom:0;height:38%;background:var(--rug);border-radius:6px 6px 16px 16px;box-shadow:inset 0 10px 0 rgba(43,33,64,.15)}
.plant b{position:absolute;bottom:34%;width:30%;height:58%;background:var(--leaf);border-radius:50% 0 50% 0;transform-origin:bottom center}
.plant b:nth-child(1){left:20%;transform:rotate(-28deg)}
.plant b:nth-child(2){left:36%;transform:rotate(4deg);height:68%;background:#3F7D47}
.plant b:nth-child(3){left:50%;transform:rotate(30deg)}
.night{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .8s}
#room.is-night .night{opacity:1}
#room.is-night .sky{background:linear-gradient(#22285A,#3B3F7A)}
#room.is-night .sun{background:#FFF4DE;box-shadow:-10px -4px 0 0 #2E3368 inset}
#room.is-bath .wall{filter:hue-rotate(-30deg) brightness(1.08)}

.pet{position:absolute;left:0;touch-action:none;cursor:grab;z-index:3}
.pet.held{cursor:grabbing}
.pet-anim,.pet-flip{width:100%;height:100%;transform-origin:50% 100%}
.pet-flip{transition:transform .35s}
.pet-flip svg,.who svg{width:100%;height:100%;overflow:visible;animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.pet.walking .pet-anim{animation:bob .38s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7%) rotate(2deg)}}
.a-wiggle{animation:wiggle .5s}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scaleY(.94)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
.a-bounce{animation:bounce .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:scale(1.2,.8)}45%{transform:translateY(-14%) scale(.92,1.1)}100%{transform:none}}
.a-chew{animation:chew .32s 5}
@keyframes chew{50%{transform:scale(1.04,.95)}}
.a-shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-6%)}40%,80%{transform:translateX(6%)}}
.a-spin{animation:spin 1s ease-in-out}
.pet-anim.a-spin{transform-origin:50% 62%}
@keyframes spin{to{transform:rotate(360deg)}}
.a-jump{animation:jump .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes jump{0%{transform:scale(1.15,.85)}40%{transform:translateY(-38%) rotate(-8deg)}100%{transform:none}}
.a-roll{animation:roll 1.6s ease-in-out}
@keyframes roll{0%{transform:none}25%{transform:rotate(-80deg) translateX(-10%)}50%{transform:rotate(-170deg) translateY(10%)}75%{transform:rotate(-80deg)}100%{transform:none}}
.a-dangle{animation:dangle .6s ease-in-out infinite}
@keyframes dangle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-glow{animation:glow 2.2s ease-in forwards}
@keyframes glow{0%{filter:none;transform:none}60%{filter:brightness(1.6) drop-shadow(0 0 18px #fff)}100%{filter:brightness(3) drop-shadow(0 0 40px #fff);transform:translateY(-12%) scale(1.15)}}
.a-sneeze{animation:sneeze .6s}
@keyframes sneeze{30%{transform:scale(.92,1.08) translateY(-4%)}55%{transform:scale(1.12,.88) translateX(-4%)}}
.spinme{animation:spin .6s linear infinite;transform-box:fill-box;transform-origin:center}

.thought{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;background:var(--paper);box-shadow:0 5px 0 rgba(43,33,64,.25);display:grid;place-items:center;z-index:4;pointer-events:none;animation:float 1.8s ease-in-out infinite}
.thought svg{width:40px;height:40px}
.thought::after{content:"";position:absolute;left:12px;bottom:-14px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
@keyframes float{50%{margin-top:-6px}}

.hud{position:absolute;left:0;right:0;top:0;padding-block:14px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 12px;z-index:6;pointer-events:none}
.hud > *{pointer-events:auto}
.hud-right{display:flex;gap:8px;flex:none}
.needs{display:flex;gap:8px}
.need{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) var(--v), rgba(255,244,222,.35) 0);display:grid;place-items:center;box-shadow:0 4px 0 rgba(43,33,64,.3)}
.need span{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.need svg{width:28px;height:28px}
.need.low{animation:nag 1s ease-in-out infinite}
@keyframes nag{50%{transform:scale(1.12)}}
.tag{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;flex:1}
.tag b{background:var(--paper);border-radius:999px;padding:6px 16px 6px 6px;font-size:20px;font-weight:900;box-shadow:0 4px 0 rgba(43,33,64,.3);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.tag .lv{background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 10px;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.tag .nm{overflow:hidden;text-overflow:ellipsis}
.grow{width:130px;height:12px;border-radius:999px;background:rgba(255,244,222,.4);overflow:hidden;box-shadow:0 2px 0 rgba(43,33,64,.25)}
.grow i{display:block;height:100%;width:var(--g,0%);background:var(--sun);border-radius:inherit;transition:width .4s}
.icon-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 rgba(43,33,64,.3);flex:none;position:relative;padding:0}
.icon-btn svg{width:30px;height:30px}
.egg-meter{background:conic-gradient(var(--sun) var(--m,0%), rgba(255,244,222,.45) 0)}
.egg-meter > span{width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.egg-meter svg{width:26px;height:30px}
.badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:var(--rug);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 var(--ink);animation:nag 1.2s infinite}

.toolbar{position:absolute;left:0;right:0;bottom:0;padding-block:10px 16px;display:flex;justify-content:center;gap:clamp(8px,3vw,24px);z-index:6}
.tool{width:clamp(56px,15vw,84px);aspect-ratio:1;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;box-shadow:0 7px 0 var(--ink);transition:transform .08s, background .2s;padding:0}
.tool svg{width:58%;height:58%}
.tool:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.tool.on{background:var(--sun)}
.tray{position:absolute;left:0;right:0;top:84px;display:flex;justify-content:center;z-index:9;pointer-events:none}
.tray-in{display:flex;gap:10px;background:var(--paper);padding:10px 14px;border-radius:28px;box-shadow:0 6px 0 rgba(43,33,64,.35);pointer-events:auto;animation:trayup .25s ease-out;flex-wrap:wrap;justify-content:center}
@keyframes trayup{from{transform:translateY(-30px);opacity:0}}
.food{width:clamp(56px,15vw,70px);aspect-ratio:1;border-radius:20px;border:0;background:#F5E5C4;display:grid;place-items:center;touch-action:none;padding:0}
.food svg{width:78%;height:78%;pointer-events:none}
.food.meds{background:#CFEFE6;animation:nag 1s infinite}
.ghost{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;z-index:20;pointer-events:none}
.ghost svg{width:100%;height:100%}
.sponge{position:absolute;width:66px;height:46px;margin:-23px 0 0 -33px;border-radius:14px;background:#FFE266;box-shadow:inset 0 -8px 0 #E8B93A, 0 4px 0 rgba(43,33,64,.3);pointer-events:none;z-index:8;background-image:radial-gradient(#E8B93A 2px,transparent 3px);background-size:12px 12px}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.p{position:absolute;transform:translate(-50%,-50%);font-weight:900;line-height:1;pointer-events:none}
.p svg{width:100%;height:100%}
.float{animation:pfloat 1.2s ease-out forwards}
@keyframes pfloat{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-260%) scale(1.1)}}
.burst{animation:pburst .9s ease-out forwards}
@keyframes pburst{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
.bub{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 18%,rgba(255,255,255,.55) 20%,rgba(169,220,242,.55) 70%);border:2px solid rgba(255,255,255,.9);animation:bubin .25s ease-out}
@keyframes bubin{from{transform:translate(-50%,-50%) scale(0)}}
.bub.popit{animation:bubpop .35s ease-in forwards}
@keyframes bubpop{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.drop{width:8px;height:18px;border-radius:50%;background:#7CCDF0;animation:fall .7s linear forwards}
@keyframes fall{to{transform:translate(-50%,calc(-50% + var(--dy)));opacity:.2}}
.shell{width:40px;height:30px;background:var(--paper);border-radius:50% 50% 20% 20%;animation:pburst 1s ease-out forwards}
.say{font-size:clamp(26px,7vw,40px);color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:pfloat 1.4s ease-out forwards}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
.flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:31;background:var(--paper);border-radius:36px;padding:22px 30px 24px;box-shadow:0 10px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(86vw,380px);text-align:center;animation:bannerin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes bannerin{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.banner svg{width:76px;height:76px}
.banner b{font-size:clamp(26px,7vw,34px);font-weight:900;text-wrap:balance;overflow-wrap:anywhere}
.banner span{font-size:18px;font-weight:600;text-wrap:balance}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);z-index:32;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px 10px 10px;display:flex;align-items:center;gap:10px;font-size:18px;white-space:nowrap;animation:trayup .3s ease-out;pointer-events:none;max-width:calc(100% - 32px)}
.toast svg{width:30px;height:30px;flex:none}

.score{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:6px;font-size:20px;font-weight:900;box-shadow:0 4px 0 rgba(43,33,64,.3);font-variant-numeric:tabular-nums}
.pill svg{width:26px;height:26px}

/* ---------- Bus ---------- */
#bus{background:linear-gradient(#A9DCF2 0 58%, #8CC07A 58% 64%, #66657A 64% 88%, #8CC07A 88%)}
.lane{position:absolute;left:0;right:0;top:75.5%;height:6px;background:repeating-linear-gradient(90deg,var(--paper) 0 40px,transparent 40px 80px)}
.bus-school{position:absolute;right:6%;top:24%;width:min(36vw,220px);aspect-ratio:1.3;background:#E8735A;border:4px solid var(--ink);border-radius:8px;box-shadow:inset 0 -20px 0 #C95E48}
.bus-school::before{content:"";position:absolute;left:-8%;right:-8%;top:-34%;height:38%;background:#B23A6B;clip-path:polygon(50% 0,100% 100%,0 100%)}
.bus-school i{position:absolute;bottom:0;left:40%;width:20%;height:42%;background:var(--ink);border-radius:6px 6px 0 0}
.busel{position:absolute;left:50%;top:84%;width:min(84vw,440px);aspect-ratio:2.2;margin-left:calc(min(84vw,440px) / -2);transform:translate(-160vw,-100%);will-change:transform}
.bbody{position:absolute;left:0;right:0;top:0;bottom:16%;background:var(--sun);border:4px solid var(--ink);border-radius:22px 46px 14px 14px;box-shadow:inset 0 -14px 0 #E8A92C}
.bwins{position:absolute;left:5%;right:22%;top:12%;height:42%;display:flex;gap:4%}
.bwin{flex:1;background:#D8EEF7;border-radius:10px;border:4px solid var(--ink);overflow:hidden;position:relative}
.bwin .who{position:absolute;left:-15%;width:130%;top:8%;height:130%}
.bfront{position:absolute;right:4%;top:12%;width:14%;height:52%;background:#D8EEF7;border:4px solid var(--ink);border-radius:8px 22px 8px 8px}
.bstripe{position:absolute;left:0;right:0;top:64%;height:7%;background:var(--ink)}
.blabel{position:absolute;left:31%;top:69%;font-size:clamp(12px,3vw,18px);font-weight:900;letter-spacing:.08em}
.wheel{position:absolute;bottom:2%;width:13%;aspect-ratio:1;border-radius:50%;background:var(--ink);border:4px solid #4A4060;display:grid;place-items:center}
.wheel::after{content:"";width:34%;height:34%;border-radius:50%;background:#C9C3D6}
.wheel.l{left:13%}.wheel.r{right:16%}
.busel.moving .wheel{animation:spin .5s linear infinite}
.skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);border:0;background:var(--paper);border-radius:999px;padding:10px 18px;font-size:18px;box-shadow:0 4px 0 var(--ink);z-index:3}

/* ---------- School ---------- */
#school{background:linear-gradient(#F3D9A4 0 74%, #E7C88E 74% 76%, #C7874A 76%)}
#school::before{content:"";position:absolute;inset:0 0 26% 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 30px,transparent 30px 60px);pointer-events:none}
.school-main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:calc(76px)}
.board{position:relative;width:min(100%,680px);background:var(--board);border:12px solid #9C6A36;border-radius:20px;box-shadow:0 8px 0 rgba(43,33,64,.3), inset 0 0 0 3px rgba(0,0,0,.15);color:var(--chalk);padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;min-height:clamp(180px,28vh,280px)}
.board-top{display:flex;gap:8px;align-items:center;min-width:0}
.grades{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;touch-action:pan-x;padding:2px}
.grades::-webkit-scrollbar{display:none}
.chip{border:2px solid rgba(244,241,230,.55);background:transparent;color:var(--chalk);border-radius:999px;padding:6px 12px;font-size:16px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--board)}
.chalk-btn{border:2px solid rgba(244,241,230,.55);background:transparent;color:var(--chalk);border-radius:999px;padding:6px 12px;font-size:16px;display:flex;align-items:center;gap:6px;flex:none}
.chalk-btn svg{width:22px;height:22px}
.subj-label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:18px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj-label svg{width:26px;height:26px;flex:none}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.subj{border:3px dashed rgba(244,241,230,.5);background:rgba(244,241,230,.06);color:var(--chalk);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;font-size:clamp(19px,4.8vw,28px);text-align:left;min-width:0}
.subj svg{width:clamp(36px,9vw,48px);height:clamp(36px,9vw,48px);flex:none}
.subj span{min-width:0}
.subj small{display:block;font-size:14px;opacity:.8;font-weight:600}
.q{margin:0;font-size:clamp(22px,5.4vw,34px);text-align:center;text-wrap:balance;line-height:1.15}
.qpic{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;min-height:0}
.qpic svg{width:clamp(32px,8.5vw,50px);height:clamp(32px,8.5vw,50px)}
.qpic .op{font-size:clamp(30px,8vw,46px);padding:0 6px}
.qpic .big{font-size:clamp(54px,14vw,90px);line-height:1}
.qpic .sent{font-size:clamp(20px,5vw,30px);font-weight:600;font-style:italic;text-align:center}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.emo{font-size:var(--emo);line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;display:block}
.ans.has-emo{flex-direction:column;gap:2px;padding-block:8px}
.ans small{font-size:clamp(13px,3.4vw,16px);font-weight:700;opacity:.7;line-height:1.1}
.qpic .emo{font-size:calc(var(--emo) * 1.3)}
.qpic .emo.row{font-size:calc(var(--emo) * .62);letter-spacing:.1em;display:inline}
.qpic .clock{width:clamp(110px,28vw,170px);height:clamp(110px,28vw,170px)}
.qpic svg[style]{flex:none}
.why{display:flex;gap:10px;align-items:center;background:rgba(244,241,230,.12);border-radius:14px;padding:8px 10px 8px 12px;font-size:clamp(16px,4vw,21px);font-weight:600;line-height:1.3;animation:trayup .3s ease-out;text-wrap:pretty}
.why > svg{width:26px;height:26px;flex:none}
.why span{flex:1;min-width:0}
.next-btn{flex:none;font-size:16px;padding:6px 12px}
.board.bonus{border-color:#E8A92C;box-shadow:0 0 0 5px #FFC83D,0 8px 0 rgba(43,33,64,.3)}
.bonus-tag{background:#FFC83D;color:var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;letter-spacing:.08em;flex:none}
.stars{display:inline-flex;gap:1px;vertical-align:middle;margin-left:6px;color:var(--chalk)}
.stars svg{width:16px;height:16px}
.subj .stars{display:flex;margin:2px 0 0}
.rrow .stars{color:var(--ink)}
.banner .stars svg{width:44px;height:44px}
.answers{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:min(100%,680px)}
.answers.long{grid-template-columns:1fr}
@media (max-width:520px){.answers.n4{grid-template-columns:1fr 1fr}.answers.mid{grid-template-columns:1fr}}
.ans{border:0;border-radius:20px;background:var(--paper);box-shadow:0 6px 0 var(--ink);font-size:clamp(20px,5vw,28px);padding:10px 12px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;transition:opacity .3s, transform .3s;line-height:1.1;text-wrap:balance}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.ans svg{width:clamp(30px,8vw,44px);height:clamp(30px,8vw,44px)}
.ans .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.ans .grp svg{width:clamp(22px,6vw,32px);height:clamp(22px,6vw,32px)}
.ans .shape svg{width:clamp(48px,13vw,64px);height:clamp(48px,13vw,64px)}
.answers.pics .ans{min-height:clamp(84px,20vw,110px)}
.answers.pics .ans > svg{width:clamp(52px,14vw,76px);height:clamp(52px,14vw,76px)}
.ans.right{background:var(--mint);animation:bounce .55s cubic-bezier(.3,1.5,.5,1)}
.ans.wrong{opacity:.22;transform:scale(.92);pointer-events:none}
.desks{margin-top:auto;width:100%;height:clamp(120px,23vh,210px);position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,2vw,18px);padding-bottom:6px}
.seat{position:relative;flex:none;cursor:pointer}
.seat.teach{margin-right:clamp(4px,3vw,30px)}
.seat .who{position:absolute;left:0;right:0;top:-26%;bottom:26%;transform-origin:50% 100%}
.seat.teach .who{top:0;bottom:0}
.seat .desk{position:absolute;left:-12%;right:-12%;bottom:-4px;height:30%;background:#B9844A;border:4px solid var(--ink);border-radius:10px 10px 4px 4px;box-shadow:inset 0 -8px 0 #9C6A36}
.seat.me .desk{background:#D2A162}
.seat.teach::after{content:"";position:absolute;right:-6%;bottom:30%;width:6px;height:70%;background:#7A4E2A;border-radius:3px;transform:rotate(18deg);transform-origin:bottom}
.stickers-pill{display:flex;align-items:center;gap:6px}

/* ---------- Nest ---------- */
#nest{background:linear-gradient(#F7D3A6,#F2A97F)}
.nest-title{flex:1;text-align:center;margin:0;font-size:28px;font-weight:900;align-self:center}
.nest-scroll{position:absolute;left:0;right:0;top:80px;bottom:0;overflow-y:auto;touch-action:pan-y;padding-block:6px 30px}
.nest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:900px;margin:0 auto}
.ncard{border:0;border-radius:26px;background:var(--paper);box-shadow:0 6px 0 rgba(43,33,64,.45);padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative}
.ncard .mini{width:100%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
.ncard .mini > div{width:100%;height:100%}
.ncard b{font-size:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard small{font-size:14px;font-weight:600;opacity:.75}
.ncard.cur{box-shadow:0 0 0 4px var(--sun),0 6px 0 rgba(43,33,64,.45)}
.ncard .egg{width:60%;animation:wob 1.6s ease-in-out infinite;transform-origin:50% 90%}
.ncard.meter{background:rgba(255,244,222,.55);box-shadow:none;border:3px dashed rgba(43,33,64,.3)}
.mbar{width:80%;height:12px;border-radius:999px;background:rgba(43,33,64,.15);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--sun);border-radius:inherit}

/* ---------- Settings ---------- */
.sheet{position:absolute;inset:0;z-index:40;background:rgba(43,33,64,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--paper);width:100%;max-width:540px;max-height:88%;overflow:auto;border-radius:30px 30px 0 0;padding-block:20px 28px;display:flex;flex-direction:column;gap:18px;animation:up .3s ease-out;touch-action:pan-y}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{margin:0;font-size:26px;font-weight:900}
.sheet h3{margin:0 0 8px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:3px solid var(--ink);border-radius:18px;background:transparent;padding:12px 8px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:600;font-size:13px;opacity:.75}
.seg button[aria-pressed="true"]{background:var(--sun)}
.toggles{display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:#F5E5C4;border-radius:16px;padding:12px 16px;font-size:18px;text-align:left}
.toggle small{display:block;font-weight:600;font-size:13px;opacity:.75}
.toggle i{width:52px;height:30px;border-radius:999px;background:rgba(43,33,64,.25);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--mint)}
.toggle[aria-pressed="true"] i::after{transform:translateX(22px)}
.secrets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.secret{background:#F5E5C4;border-radius:14px;padding:10px 12px;font-size:15px;min-width:0}
.secret.found{background:var(--mint)}
.secret small{display:block;font-weight:600;font-size:12px;opacity:.8;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.report{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#F5E5C4;border-radius:14px;padding:8px 12px;font-size:17px}
.rrow svg{width:30px;height:30px}
.rrow small{display:block;font-weight:600;font-size:13px;opacity:.75}
.rrow .stk{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:150px}
.rrow .stk svg{width:22px;height:22px}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.mark{display:flex;flex-direction:column;align-items:center;gap:2px;background:#F5E5C4;border-radius:12px;padding:6px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.mark svg{width:26px;height:26px}
.danger{border:3px solid var(--rug);background:transparent;border-radius:16px;padding:12px;font-size:18px;color:#B4442E}
.confirm{display:flex;gap:8px}
.confirm button{flex:1;border:0;border-radius:16px;padding:12px;font-size:17px}
.confirm .yes{background:var(--rug);color:#fff}
.confirm .no{background:#F5E5C4}


/* ---------- Coins, room extras ---------- */
.cicon svg,.pill .cicon svg{width:26px;height:26px}
.coinpill{border:0;cursor:pointer;font-family:inherit;color:var(--ink)}
.coinpill:active{transform:translateY(3px)}
.emo-ic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:1em;line-height:1;display:inline-block}
.food .emo-ic{font-size:clamp(30px,8vw,40px)}
.ghost .emo-ic{font-size:50px;display:grid;place-items:center;width:100%;height:100%}
.p .emo-ic{font-size:inherit;width:100%;height:100%;display:grid;place-items:center}
.p[style*="width"] .emo-ic{font-size:26px}
.food.more{background:#FBE3EA}
.food.more svg{width:70%;height:70%}
.art-emo{position:absolute;right:calc(40px + 10%);top:20%;font-size:min(16vw,110px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 6px 0 rgba(43,33,64,.2))}
.art-emo.portrait{width:min(30vw,170px);aspect-ratio:4/5;background:#FFF4DE;border:10px solid #E8A92C;border-radius:8px;box-shadow:0 8px 0 rgba(43,33,64,.2), inset 0 0 0 3px #C9862A;display:grid;place-items:center;overflow:hidden}
.art-emo.portrait div{width:110%;height:110%;margin-top:10%}
.art-emo.portrait svg{width:100%;height:100%}
.floor-emo{position:absolute;left:calc(60px - 1%);bottom:0;font-size:min(22vw,150px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.window[data-view] .vb{position:absolute;left:0;right:0}
.vb.sea{top:52%;bottom:22%;background:linear-gradient(#4FB3E0,#7CCDF0)}
.vb.sand{top:78%;bottom:0;background:#F3D9A4}
.vb.mtn1{bottom:0;height:60%;background:#7A8FC9;clip-path:polygon(0 100%,0 60%,30% 10%,55% 55%,75% 25%,100% 70%,100% 100%)}
.vb.mtn2{bottom:0;height:35%;background:#4E8F55;clip-path:polygon(0 100%,0 40%,40% 0,70% 50%,100% 20%,100% 100%)}
.vb.city{bottom:0;height:62%;background:linear-gradient(90deg,#3B3F7A 0 14%,transparent 14% 18%,#2E3368 18% 34%,transparent 34% 38%,#4B4FA0 38% 52%,transparent 52% 56%,#2E3368 56% 74%,transparent 74% 78%,#3B3F7A 78%);clip-path:polygon(0 30%,14% 30%,14% 0,34% 0,34% 45%,52% 45%,52% 15%,74% 15%,74% 35%,100% 35%,100% 100%,0 100%)}
.window[data-view="v-city"] .sky{background:linear-gradient(#3B2E6E,#E8735A)}
.window[data-view="v-space"] .sky{background:#141634}
.window[data-view="v-space"] .sun{background:#F29A7F;box-shadow:inset -8px -4px 0 #D9775C}
.vb.space{inset:0;background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/22px 22px,radial-gradient(#FFE07A 1px,transparent 1.5px) 11px 9px/31px 31px}
.rug.sq{border-radius:24px;transform:translateX(-50%) perspective(400px) rotateX(55deg);transform-origin:center top;top:40%;height:52%}
.basket[data-bed="b-cloud"]{background:radial-gradient(circle at 25% 45%,#fff 0 30%,transparent 31%),radial-gradient(circle at 55% 35%,#fff 0 34%,transparent 35%),radial-gradient(circle at 80% 50%,#fff 0 28%,transparent 29%),#E3F4FB;border-radius:50%;box-shadow:0 6px 0 rgba(43,33,64,.15)}
.basket[data-bed="b-royal"]{background:linear-gradient(#E33B2E 0 40%,#B23A6B 40%);border-radius:14px 14px 30px 30px;box-shadow:inset 0 0 0 5px #FFC83D,0 6px 0 rgba(43,33,64,.2)}
.room-toy{position:absolute;z-index:2;line-height:1;transform:translateX(-50%);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:toyin .4s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
@keyframes toyin{from{transform:translate(-50%,-160%) scale(.4);opacity:0}}
.t-squish{animation:tsq .3s}
@keyframes tsq{50%{transform:translateX(-50%) scale(1.25,.7)}}
.t-roll{animation:troll 2.4s ease-in-out}
@keyframes troll{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(30%) rotate(540deg)}}
.t-yoyo{animation:tyoyo .6s ease-in-out 4}
@keyframes tyoyo{50%{transform:translate(-50%,60%)}}
.t-spin{animation:tspin 2.4s ease-in-out}
@keyframes tspin{to{transform:translateX(-50%) rotate(720deg)}}

/* ---------- Arcade ---------- */
#arcade{background:linear-gradient(#5B3FA8,#8E5BD8)}
#arcade .nest-title,#shop .nest-title{color:var(--paper)}
#arcade .nest-title{color:var(--paper)}
.arcade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px;max-width:900px;margin:0 auto}
.gcard{border:0;border-radius:26px;background:var(--paper);box-shadow:0 7px 0 rgba(20,10,50,.5);padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.gcard:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(20,10,50,.5)}
.gemo{font-size:clamp(48px,12vw,68px);line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.gcard b{font-size:24px;font-weight:900}
.gcard small{font-size:15px;font-weight:700;opacity:.75}
.gcard .ggoal{font-size:13px;opacity:.7}

.rcard,.ocard{background:var(--paper);border-radius:32px;box-shadow:0 10px 0 var(--ink);padding:20px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,380px);min-width:0;text-align:center;animation:bannerin .45s cubic-bezier(.3,1.5,.5,1)}

.omini{width:120px;height:120px}
.omini svg{width:100%;height:100%;overflow:visible}
.oscore{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}

.ocoins{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:900}

.ounlock{background:var(--mint);border-radius:14px;padding:8px 12px;font-size:16px;font-weight:800}
.ocard small{font-size:13px;font-weight:700;opacity:.7}
.obtns{display:flex;gap:10px;margin-top:8px;width:100%}
.obtn{flex:1;min-width:0;border:0;border-radius:18px;background:var(--sun);font-size:20px;padding:14px;box-shadow:0 5px 0 var(--ink)}

.mem-grid{position:absolute;inset:0;padding-block:90px 20px;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:clamp(6px,1.8vw,14px);background:linear-gradient(#3FAF8F,#2F8A70);max-width:100%}
.mcard{border:0;padding:0;background:none;perspective:600px;position:relative;min-width:0;min-height:0;max-height:100%;width:100%;aspect-ratio:3/4;margin:auto;max-width:180px}
.mcard span{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s;box-shadow:0 5px 0 rgba(20,40,30,.45)}

#shop{background:linear-gradient(#F27BB0,#F7A8BE)}

.stab{border:0;border-radius:999px;background:transparent;font-size:clamp(16px,4.4vw,20px);padding:10px 4px}

.shop-stage{height:clamp(150px,26vh,240px);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 90%,rgba(43,33,64,.18) 0 30%,transparent 31%),rgba(255,244,222,.45);border-radius:28px}

.ibtn{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:6px 12px;font-size:16px;font-weight:900;background:var(--mint);font-variant-numeric:tabular-nums;max-width:100%;text-wrap:balance;line-height:1.1}

.playbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin:0 auto;width:fit-content;z-index:7;display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:6px 6px 6px 12px;box-shadow:0 5px 0 rgba(43,33,64,.35);max-width:calc(100% - 32px);animation:trayup .25s ease-out}

.word-card{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:8;background:var(--paper);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:14px 26px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:bannerin .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.word-card .emo-ic{font-size:clamp(60px,16vw,96px)}
.word-card b{font-size:clamp(34px,9vw,54px);letter-spacing:.12em;font-weight:900}
.shoot-star{position:absolute;left:-10%;top:12%;width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,#FFF4DE);z-index:5;animation:shoot 1.4s ease-in forwards;pointer-events:none}
@keyframes shoot{to{transform:translate(120vw,30vh) rotate(14deg);opacity:0}}
.icard{position:relative}
.season{position:absolute;top:6px;left:6px;z-index:1;background:#FF8A2E;color:#fff;font-style:normal;font-size:12px;font-weight:900;border-radius:999px;padding:3px 8px;box-shadow:0 2px 0 var(--ink)}

<body>
<div id="app">
  <section class="screen" id="title">
    <div class="title-wrap pad">
      <h1 class="logo">Gib<span>bis</span></h1>
      <div class="title-egg" id="titleEgg"></div>
      <div id="titleActions"></div>

  <section class="screen" id="hatch" hidden>

    <button class="egg-btn" id="eggBtn" aria-label="Tap the egg to hatch it"></button>
    <div class="tap-ring" id="tapRing"></div>
    <div class="hatch-pet" id="hatchPet" hidden></div>
    <div class="namer pad" id="namer" hidden></div>
  </section>

  <section class="screen" id="room" hidden>
    <div class="layer wall" id="lWall">
      <div class="window"><div class="sky"></div><div class="sun"></div><div id="viewX"></div></div><div class="art-emo" id="artEmo" hidden></div>
      <div class="shelf"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="layer floor" id="lFloor"><div class="rug"></div><div class="basket"></div></div>
    <div class="pet" id="pet"><div class="pet-anim"><div class="pet-flip"></div></div></div>
    <div class="thought" id="thought" hidden></div>
    <div class="layer fore" id="lFore"><div class="plant"><b></b><b></b><b></b></div><div class="floor-emo" id="floorEmo" hidden></div></div>
    <div class="night"></div>

      <div class="needs" id="needs"></div>

      <div class="hud-right">
        <button class="pill coinpill" id="coinBtn" aria-label="Shop"><span class="cicon"></span><span class="coin-count">0</span></button>
        <button class="icon-btn egg-meter" id="nestBtn" aria-label="Nest: all your creatures"><span></span></button>
        <button class="icon-btn" id="gearBtn" aria-label="Grown-up settings"></button>

<script>
(()=>{
const $=(s,el=document)=>el.querySelector(s);
const $$=(s)=>[...document.querySelectorAll(s)];
const app=$('#app'), fx=$('#fx');
const KEY='hatchlings.v1';
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const now=()=>performance.now();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null, scene='title';
const P=()=>S&&S.pets?S.pets[S.cur]:null;

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}

/* ================= SAVING =================
   Every save goes to this device's storage AND (when the viewer is signed in to Claude)
   to a private per-person document, so progress survives closing the app. */
const CLOUD={ref:null,ready:false,state:'checking',pend:null,lastCmp:'',busy:false,lastAt:0,timer:null};
function save(){
  if(!S)return;S.savedAt=Date.now();let j;try{j=JSON.stringify(S)}catch(e){return}
  try{localStorage.setItem(KEY,j)}catch(e){}
  if(CLOUD.ready){CLOUD.pend=j;if(!CLOUD.timer)CLOUD.timer=setTimeout(cloudFlush,Math.max(1500,15000-(Date.now()-CLOUD.lastAt)))}
}
async function cloudFlush(force){
  clearTimeout(CLOUD.timer);CLOUD.timer=null;
  if(!CLOUD.ready||!CLOUD.pend)return;
  if(CLOUD.busy){CLOUD.timer=setTimeout(cloudFlush,1500);return}
  const j=CLOUD.pend;CLOUD.pend=null;const cmp=j.replace(/"savedAt":\d+,?/,'');
  if(cmp===CLOUD.lastCmp)return;
  CLOUD.busy=true;
  try{await CLOUD.ref.set({json:j,t:Date.now(),v:3});CLOUD.lastCmp=cmp;CLOUD.lastAt=Date.now();setSaveState('cloud')}
  catch(e){const c=e&&e.code;
    if(c==='unavailable'){CLOUD.pend=CLOUD.pend||j;CLOUD.timer=setTimeout(cloudFlush,3000+Math.random()*3000)}
    else if(c==='resource_exhausted'){CLOUD.pend=CLOUD.pend||j;CLOUD.timer=setTimeout(cloudFlush,20000)}
    else{CLOUD.ready=false;setSaveState('local')}}
  CLOUD.busy=false;
}
function setSaveState(st){CLOUD.state=st;const el=$('#saveNote');if(el)el.textContent=saveText()}
function saveText(){return CLOUD.state==='cloud'?'☁️ Progress saves to your Claude account':CLOUD.state==='checking'?'Loading your Gibbis…':'Your Gibbis save on this device'}
function normalize(s){
  if(!s)return null;
  s.mode='survival';
  if(!s.xpv){(s.pets||[]).forEach(p=>{p.xp=Math.min(p.xp||0,100)});s.xpv=2}
  s.pets.forEach(p=>{genesOf(p);if(!p.lv)p.lv=zeroPts();if(!p.school)p.school=Object.fromEntries(SUBJECTS.map(k=>[k,{c:0,st:0}]));p.wear=p.wear||{};p.best=p.best||{};p.needs=p.needs||{food:80,energy:80,clean:80,fun:80}});
  if(s.cur>=s.pets.length)s.cur=Math.max(0,s.pets.length-1);
  if(!s.teacher)s.teacher=randGenes();if(s.coins==null)s.coins=0;s.owned=s.owned||[];s.decor=s.decor||{};
  if(!s.settings)s.settings={sfx:true,music:true,fast:false};
  return s;
}
async function cloudInit(){
  const fallback=setTimeout(()=>{if(CLOUD.state==='checking'){setSaveState('local');if(scene==='title')renderTitle()}},4000);
  await cloudInit2();clearTimeout(fallback);
  if(scene==='title')renderTitle();
}
async function cloudInit2(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){setSaveState('local');return}
    // check who is viewing first; signed-out viewers never touch the account storage
    const user=await window.claude.use('user');if(!user){setSaveState('local');return}
    const uid=await user.id();if(!uid){setSaveState('local');return}
    const db=await window.claude.use('db');if(!db){setSaveState('local');return}
    CLOUD.ref=db.doc('data/users/'+uid+'/save');
    const snap=await CLOUD.ref.get();
    if(snap.exists){
      let remote=null;try{remote=JSON.parse(snap.data().json)}catch(e){}
      const localEmpty=!S||!S.pets||!S.pets.length;
      if(remote&&remote.pets&&(localEmpty||((remote.savedAt||0)>(S.savedAt||0)&&scene==='title'))){
        S=normalize(migrate(remote));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        CLOUD.lastCmp=JSON.stringify(S).replace(/"savedAt":\d+,?/,'');
        if(scene==='title')renderTitle();
      }
    }
    CLOUD.ready=true;setSaveState('cloud');if(S&&S.pets&&S.pets.length)save();
  }catch(e){setSaveState('local')}
}

function startMusic(){

    musicGain.gain.setTargetAtTime(want,AC.currentTime,.3);
    if(want===0){mNext=AC.currentTime+.1;return}
    const m=MUS[musicMode]||MUS.day, step=60/m.bpm/2;
    while(mNext<AC.currentTime+.25){

const BAD_VOICES=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|trinoids|whisper|zarvox|wobble|superstar|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|novelty/i;
const GOOD_VOICES=['ava','zoe','samantha','allison','susan','nicky','evan','tom','serena','karen','moira','tessa','google us english','aria','jenny','libby','sonia'];
let VOICE=null,voiceList=[];
function voiceScore(v){
  if(!/^en/i.test(v.lang)||BAD_VOICES.test(v.name))return -1;
  const n=v.name.toLowerCase();let s=0;
  if(/premium/.test(n))s+=100;else if(/enhanced/.test(n))s+=60;
  if(/natural|neural|online/.test(n))s+=70;
  const gi=GOOD_VOICES.findIndex(g=>n.includes(g));if(gi>=0)s+=40-gi;
  if(/en[-_]us/i.test(v.lang))s+=12;else if(/en[-_](gb|au|ie|ca)/i.test(v.lang))s+=6;
  if(v.localService)s+=3;
  if(/compact/.test(n))s-=20;
  return s;
}
function pickVoice(){
  try{voiceList=speechSynthesis.getVoices()||[]}catch(e){voiceList=[]}
  let best=null,bs=-1;for(const v of voiceList){const s=voiceScore(v);if(s>bs){bs=s;best=v}}
  VOICE=best;
}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}
function speechClean(t){
  return String(t)
    .replace(/_{2,}/g,', blank,')
    .replace(/°C/g,' degrees Celsius').replace(/H₂O/g,'H 2 O').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ')
    .replace(/(\d)\s*\+\s*(\d)/g,'$1 plus $2').replace(/=\s*\?/g,'equals what?')
    .replace(/…/g,'...').replace(/\s+/g,' ').trim();
}
function chunks(t){
  // one utterance per sentence; commas stay inside so the voice phrases them naturally
  const out=[];const re=/.+?(?:[.!?]+(?=\s|$)|$)/g;let m;
  while((m=re.exec(t))){const x=m[0].trim();if(!x)continue;const end=x.slice(-1);out.push({text:x,pause:end==='?'?520:/[.!]/.test(end)?420:200});if(re.lastIndex>=t.length)break}
  return out;
}
let sayGen=0,sayTimer=null;
function say(t,opt={}){
  if(!S||!S.settings.sfx||!('speechSynthesis' in window))return;
  if(!VOICE)pickVoice();
  const parts=Array.isArray(t)?t.flatMap(x=>chunks(speechClean(x))):chunks(speechClean(t));
  if(Array.isArray(t)&&parts.length)parts[parts.length-1].pause=0;
  const gen=++sayGen;clearTimeout(sayTimer);
  try{speechSynthesis.cancel()}catch(e){}
  let i=0;
  const next=()=>{
    if(gen!==sayGen||i>=parts.length)return;
    const p=parts[i++];
    let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(guard);if(gen===sayGen)sayTimer=setTimeout(next,p.pause)};
    try{
      const u=new SpeechSynthesisUtterance(p.text);
      if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='en-US';
      u.rate=(opt.rate||.93)*(S.grade<=1&&scene==='school'?.95:1);u.pitch=opt.pitch||1.04;u.volume=1;
      u.onend=fin;u.onerror=fin;
      var guard=setTimeout(fin,600+p.text.length*95);
      speechSynthesis.speak(u);
    }catch(e){fin()}
  };
  setTimeout(next,60);
}
function hush(){sayGen++;clearTimeout(sayTimer);try{speechSynthesis.cancel()}catch(e){}}

/* ---------------- Creature babble ---------------- */
const VOWELS=[[730,1090],[530,1840],[270,2290],[570,840],[300,870],[660,1720]];
function babble(p,mood='happy',n){
  if(!AC||!S||!S.settings.sfx||!p)return;
  const g=genesOf(p);const L=p.level||1;
  const base=(420+(g.h%9)*28)*(1.18-L*.035)*(g.body==='wide'?.88:g.body==='tall'?1.08:1);
  n=n||ri(2,4);let t=AC.currentTime+.02;
  for(let i=0;i<n;i++){
    const d=rand(.08,.15),f=base*rand(.9,1.15)*(mood==='sad'?1-i*.06:mood==='ask'&&i===n-1?1.35:1+i*.03);
    const o=AC.createOscillator(),vib=AC.createOscillator(),vg=AC.createGain(),gn=AC.createGain();
    const v=pick(VOWELS),f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),mix=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(f*.92,t);o.frequency.linearRampToValueAtTime(f*(mood==='sad'?.85:1.08),t+d);
    vib.frequency.value=rand(18,26);vg.gain.value=f*.03;vib.connect(vg);vg.connect(o.frequency);
    f1.type='bandpass';f1.frequency.value=v[0]*1.25;f1.Q.value=6;f2.type='bandpass';f2.frequency.value=v[1]*1.25;f2.Q.value=8;
    o.connect(f1);o.connect(f2);f1.connect(mix);f2.connect(mix);mix.gain.value=.9;mix.connect(gn);
    gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.55,t+.015);gn.gain.setValueAtTime(.5,t+d*.6);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    gn.connect(master);o.start(t);vib.start(t);o.stop(t+d+.03);vib.stop(t+d+.03);
    t+=d+rand(.025,.06);
  }
}

/* ---------------- Growth ---------------- */
/* Pace: about an hour of active play from hatch to level 10 (~6 min a level, ~17 growth a minute).
   Each activity tires out a little when repeated (never below 40%), switching activities gives a 15% bonus,
   and a safety bucket caps spam at ~40 a minute. Sleep grows slowly and skips both rules. */
const B={t:20,fat:{},last:null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function grow(n,act){
  const p=P();if(!p||n<=0)return;
  if(S.settings.fast)n*=10;
  else if(act&&act!=='sleep'){
    const f=B.fat[act]||0;
    n*=Math.max(.4,1-f);
    if(B.last&&B.last!==act)n*=1.15;
    B.fat[act]=Math.min(1,f+n*.06);B.last=act;
    n=Math.min(n,B.t);B.t-=n;
  }
  if(n<=0)return;
  eggFill(n*.4);
  if(p.level>=MAXL)return;
  p.xp+=n;
  while(p.level<MAXL&&p.xp>=need(p.level)){p.xp-=need(p.level);levelUp(p)}
  if(p.level>=MAXL)p.xp=0;
}
function gain(path,n){const p=P();if(!p)return;p.pts[path]=(p.pts[path]||0)+n;p.lv[path]=(p.lv[path]||0)+n}
function eggFill(n){
  S.eggMeter+=n;
  while(S.eggMeter>=100){S.eggMeter-=100;S.eggs++;toast('egg','A new egg is in the nest!');SFX.chime();if(scene==='room')hud(true)}
}
function levelUp(p){
  p.level++;
  let top=null,v=0;for(const k of PATH_KEYS)if((p.lv[k]||0)>v){v=p.lv[k];top=k}
  if(top)p.marks.push(top);
  p.lv=zeroPts();
  let found=null;
  if(p.rev&&p.revOrder&&p.revOrder.length){found=p.revOrder.shift();p.rev.push(found)}
  const mile=[4,7,10].includes(p.level);
  const bits=[];if(found)bits.push('New: '+featureName(genesOf(p),found));if(top)bits.push('+'+PATHS[top].name);
  const lc=20+10*p.level;S.coins=(S.coins||0)+lc;bits.push(`+${lc} coins`);
  if(maxLevel()===p.level){const nw=newAtLevel(p.level);if(nw.length)bits.push(`${nw.length} new things in the shop!`)}
  $$('.coin-count').forEach(el=>el.textContent=S.coins);
  if(mile&&scene==='room'){evolveAnim(p,bits)}
  else{
    SFX.level();R.key='';
    setTimeout(()=>{const c=petCenter();sparkles(c.x,c.y,14);hearts(c.x,c.top,3)},50);
    banner(top?PATH_ICON[top]:'star',mile?`${p.name} evolved!`:`Level ${p.level}!`,(mile?`Level ${p.level}. `:'')+bits.join(' · '));
    babble(p,'happy',4);setTimeout(()=>say(mile?`Wow! ${p.name} evolved!`:`Level ${p.level}!`),700);
  }
  save();
}

/* needs */
function needsTick(dt){
  const p=P();if(!p)return;
  if(S.mode!=='survival'){p.needs={food:100,energy:100,clean:100,fun:100};p.sick=false;return}
  const n=p.needs,sl=R.state==='sleep'&&scene==='room';
  n.food-=dt*100/480*(sl?.5:1);n.clean-=dt*100/600;if(!sl)n.fun-=dt*100/(scene==='school'?900:420);
  if(sl)n.energy+=dt*6;else n.energy-=dt*100/720*(scene==='game'?1.4:1);
  for(const k in n)n[k]=clamp(n[k],0,100);
  if(!p.sick){
    const empty=['food','energy','clean','fun'].filter(k=>n[k]<=5).length;
    if(empty>=2)p.sickT+=dt;else p.sickT=Math.max(0,p.sickT-dt);
    if(p.sickT>45){p.sick=true;p.sickT=0;if(scene==='room'){SFX.sneeze();anim(petAnim,'a-sneeze',600)}}
  }
}
function urgentNeed(){
  const p=P();if(S.mode!=='survival')return null;if(p.sick)return 'meds';
  let k=null,v=35;for(const kk of ['food','energy','clean','fun'])if(p.needs[kk]<v){v=p.needs[kk];k=kk}
  return k?NEED_ICON[k]:null;
}

function roomTick(dt){
  const p=P();R.idleT+=dt;
  if(R.play)playTick(dt);R.mv=(R.mv||0)-dt;if(room.scrollLeft||room.scrollTop){room.scrollLeft=0;room.scrollTop=0}
  if(R.state==='idle'){
    R.nextWander-=dt;
    if(R.nextWander<=0){R.tx=rand(.12,.88);R.state='walk';R.nextWander=rand(3,7)}
    if(R.idleT>25&&!isSad()){R.idleT=0;idleTrick()}
  }
  if(R.state==='walk'||R.state==='tobed'){
    const sp=(isSad()?.06:.12)*(R.state==='tobed'?1.6:1);const d=R.tx-R.x;
    if(Math.abs(d)<.008){R.x=R.tx;if(R.state==='tobed')startSleep();else{R.state='idle';if(R.toyGo&&R.toy){R.toyGo=false;playToy()}}}
    else{R.dir=Math.sign(d);R.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt)}
  }
  if(R.state==='sleep'){
    R.sleepT+=dt;R.zT-=dt;
    if(R.zT<=0){R.zT=1.5;const c=petCenter();spawn('z',c.x+c.w*.25,c.top+c.h*.2,'float',1400,{dx:30,style:{fontSize:rand(24,40)+'px',color:'#FFF4DE'}});if(Math.random()<.5)SFX.snore()}
    if(Math.floor(R.sleepT/4)>R.sleepGain){R.sleepGain++;gain('sleepy',1);grow(.5,'sleep')}
    const done=R.nap?R.sleepT>4.5:(S.mode==='survival'?(p.needs.energy>=100&&R.sleepT>8):R.sleepT>22);
    if(done)wake();
  }
  if(R.state==='falling'){
    R.vy+=2600*dt;R.lift-=R.vy*dt;
    if(R.lift<=0){R.lift=0;R.state='idle';anim(petAnim,'a-bounce',550);SFX.boing();temp('happy',800)}
  }
  if(p.sick&&R.state==='idle'){R.sneezeT-=dt;if(R.sneezeT<=0){R.sneezeT=rand(6,10);SFX.sneeze();anim(petAnim,'a-sneeze',600)}}
  const px=petPx();const sc=petScale(p.level);
  petEl.style.transform=`translate(${px-L.size/2}px,${-R.lift}px)`;
  const trick=R.play&&R.play.trick&&R.lift>0?` rotate(${R.dir*Math.min(360,R.lift/(L.H*.18)*360)}deg)`:'';
  petFlip.style.transition=trick?'none':'';
  petFlip.style.transform=`scale(${R.dir*sc},${sc})${trick}`;
  petEl.classList.toggle('walking',R.state==='walk'||R.state==='tobed'||R.mv>0||!!R.skate);
  renderRoomPet();
  const k=(R.x-.5);
  $('#lWall').style.transform=`translateX(${-k*24}px)`;$('#lFore').style.transform=`translateX(${k*46}px)`;
  const th=$('#thought');const u=(R.state==='idle'||R.state==='walk')?urgentNeed():null;
  if(u){th.hidden=false;if(th.dataset.u!==u){th.innerHTML=I[u];th.dataset.u=u}th.style.transform=`translate(${px+L.size*sc*.22}px,${L.H-L.bottom-L.size*sc-58-R.lift}px)`}else th.hidden=true;
  const tr=$('#tray');if(!tr.hidden&&tr.dataset.mode==='food'&&!!tr.querySelector('.meds')!==!!p.sick)openTray();
  hudT-=dt;if(hudT<=0){hudT=.25;hud()}
}

  const others=S.pets.filter((_,i)=>i!==S.cur).slice(0,2);while(others.length<2)others.push(fakePet(ri(2,6)));
  const wins=[P(),...others];
  $('#busWins').innerHTML=wins.map((p,i)=>`<div class="bwin"><div class="who">${petSVG(p,i===0?'happy':'ok')}</div></div>`).join('');
  const bus=$('#busEl');bus.style.transition='none';bus.style.transform='translate(-160vw,-100%)';void bus.offsetWidth;
  bus.classList.add('moving');SFX.engine();
  bus.style.transition='transform 1.4s cubic-bezier(.25,.9,.35,1)';bus.style.transform='translate(0,-100%)';
  busTimers.push(setTimeout(()=>{bus.classList.remove('moving');SFX.honk();say('All aboard!');setTimeout(()=>babble(P(),'happy',3),900)},1400));

  busTimers.push(setTimeout(enterSchool,3400));

  if(typeof x==='object')return x;

  return {q,pic:o.pic||'',say:o.say||q,why:o.why||'',id:o.id||(q+'|'+chKey(r)),bank:o.bank||null,ch:o.keepOrder?[r,...ws]:shuffle([r,...ws])};

/* No-repeat decks: each bank is dealt like a shuffled deck, saved per player, and only reshuffled once every card is used. */
function deckDraw(key,len){
  S.decks=S.decks||{};let d=S.decks[key];
  if(!Array.isArray(d)||!d.length||d.some(i=>i>=len)){d=shuffle([...Array(len).keys()]);}
  const i=d.pop();S.decks[key]=d;return i;
}
function fact(bank,key){
  const i=deckDraw(key,bank.length);const f=bank[i];
  return Q(f[0],f[1],[f[2],f[3]].filter(x=>x!=null),{why:f[4]||'',id:key+':'+i,bank:key+':'+i});
}

function roman(v){
  const map=[[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  const to=n=>{let s='';for(const [k,r] of map)while(n>=k){s+=r;n-=k}return s};
  return Q(`What number is ${to(v)}?`,v,nums(v,3,v>20?10:3,1),{say:`What number is the Roman numeral ${to(v).split('').join(' ')}?`,why:'I = 1, V = 5, X = 10, L = 50, C = 100. A smaller one before a bigger one means subtract.'});
}

    ()=>{const s=pick(SPELL2);return Q('Which word is spelled right?',s[0],[s[1],s[2]],{say:`Which one spells the word ${s[0]} correctly?`})},

  ]);

  if(Math.random()<.5)return Q(`Which planet is ${ORD[i]} from the Sun?`,PLANETS[i],others(PLANETS,PLANETS[i],2),{id:'pl'+i,why:'Order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.'});
  const j=Math.min(i,6);return Q(`Which planet comes right after ${PLANETS[j]}?`,PLANETS[j+1],others(PLANETS.filter(p=>p!==PLANETS[j]),PLANETS[j+1],2),{id:'pla'+j,why:'Order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.'});
}

/* ---------- Which source each subject draws from, by grade ---------- */
function sources(subj,g){
  const S_=[];const add=(w,f)=>S_.push([w,f]);
  if(subj==='math')add(1,()=>mathQ(g));
  if(subj==='english')add(1,()=>englishQ(g));
  if(subj==='science'){
    add(3,()=>fact(SCI[g],`sci${g}`));
    if(g<=6)add(g<=1?1.2:1,()=>animalQ(g));
    if(g>=4&&g<=6)add(.5,()=>planetQ());
  }
  if(subj==='history'){
    add(3,()=>fact(HIS[g],`his${g}`));
    if(g>=3&&g<=5)add(.7,()=>geoQ('cont'));
    if(g>=5)add(1,()=>geoQ('state'));
    if(g>=6)add(.8,()=>geoQ('country'));
    if(g===7)add(.4,()=>roman(ri(1,50)));
  }
  return S_;
}
const RECENT=[];
function makeQ(subj,g){
  const src=sources(subj,g);const tot=src.reduce((a,s)=>a+s[0],0);
  let q=null;
  for(let tries=0;tries<12;tries++){
    let r=Math.random()*tot,f=src[0][1];for(const s of src){r-=s[0];if(r<=0){f=s[1];break}}
    q=f();
    if(!RECENT.includes(q.id))break;
  }
  RECENT.push(q.id);if(RECENT.length>40)RECENT.shift();
  return q;
}
/* Mastery: hand-written bank questions answered right on the first try */
function bankSize(subj,g){return subj==='science'?SCI[g].length:subj==='history'?HIS[g].length:subj==='english'&&g===7?EN6.length:0}
function bankDone(subj,g){const pre=subj==='science'?`sci${g}:`:subj==='history'?`his${g}:`:subj==='english'&&g===7?'en6:':null;if(!pre)return 0;return (S.done||[]).filter(x=>x.startsWith(pre)).length}
function subjStars(subj,g){
  const k=`${subj}:${g}`;const right=(S.right&&S.right[k])||0;
  const size=bankSize(subj,g);
  if(size){const f=bankDone(subj,g)/size;return f>=1?3:f>=.6?2:f>=.25?1:0}
  return right>=60?3:right>=30?2:right>=10?1:0;
}

function renderBoard(){
  const b=$('#board'),a=$('#answers');a.innerHTML='';a.className='answers';b.classList.remove('bonus');
  if(!SC.subj){
    b.innerHTML=`<div class="board-top"><div class="grades" id="grades">${GRADES.map((g,i)=>`<button class="chip" data-g="${i}" aria-pressed="${S.grade===i}">${g}</button>`).join('')}</div></div>
      <div class="subjects">${SUBJECTS.map(k=>{const r=P().school[k];return `<button class="subj" data-s="${k}">${I[subjIcon[k]]}<span>${subjName[k]}${starsHTML(subjStars(k,S.grade))}<small>${r.st} sticker${r.st===1?'':'s'}</small></span></button>`}).join('')}</div>`;
    const gr=$('#grades .chip[aria-pressed="true"]');if(gr)gr.scrollIntoView({inline:'center',block:'nearest'});
    return;
  }
  const q=SC.q;b.classList.toggle('bonus',!!q.bonus);
  b.innerHTML=`<div class="board-top"><button class="chalk-btn" id="toSubjects" aria-label="Back to subjects">${I.back}</button><div class="subj-label">${q.bonus?`<b class="bonus-tag">BONUS</b>`:I[subjIcon[SC.subj]]}<span>${subjName[SC.subj]} · ${GRADES[q.grade]}</span></div><button class="chalk-btn" id="sayAgain" aria-label="Read it again">${I.speaker}</button></div>
    <div class="qbody"><p class="q"></p>${q.pic?`<div class="qpic">${q.pic}</div>`:''}<div class="why" id="why" hidden></div></div>`;
  b.querySelector('.q').textContent=q.q;
  const maxLen=Math.max(...q.ch.map(c=>(c.t||'').length));
  a.style.setProperty('--n',q.ch.length);
  if(maxLen>18)a.classList.add('long');else if(maxLen>8)a.classList.add('mid');
  if(q.ch.length===4)a.classList.add('n4');
  if(q.ch.every(c=>c.h&&!c.t))a.classList.add('pics');
  q.ch.forEach((c,i)=>{const btn=document.createElement('button');btn.className='ans'+(c.h&&c.h.includes('class="emo"')?' has-emo':'');btn.dataset.i=i;if(c.h)btn.innerHTML=c.h;if(c.t){const s=document.createElement('span');s.textContent=c.t;btn.appendChild(s)}btn.setAttribute('aria-label',c.t||c.n||'answer '+(i+1));a.appendChild(btn)});
}
function readQ(pre){
  const q=SC.q;if(!q)return;const lines=pre?[pre,q.say]:[q.say];
  if(q.grade<=2){const names=q.ch.map(c=>c.n!=null?c.n:c.t).filter(Boolean);if(names.length===q.ch.length&&names.length>1){lines.push('Is it...');names.forEach((n,i)=>lines.push(i===names.length-1?`or ${n}?`:`${n},`))}}
  say(lines);
}
let nextTimer=null;
function nextQ(){
  clearTimeout(nextTimer);SC.n=(SC.n||0)+1;
  const bonus=S.grade<7&&SC.n>3&&Math.random()<.13;
  const g=bonus?S.grade+1:S.grade;
  SC.q=makeQ(SC.subj,g);SC.q.grade=g;SC.q.bonus=bonus;SC.missed=false;SC.locked=false;
  renderBoard();streakPill();
  if(bonus){SFX.chime();readQ('Bonus question! This one is a little harder.')}else readQ();
}
function streakPill(){const el=$('#streakPill');const n=SC.streak||0;el.hidden=n<2;el.innerHTML=`${FLAME}<span>${n}</span>`}
$('#board').addEventListener('click',e=>{
  audioInit();
  const g=e.target.closest('[data-g]');if(g){S.grade=+g.dataset.g;save();SFX.tap();renderBoard();say(['Pre-K','Kindergarten','First grade','Second grade','Third grade','Fourth grade','Fifth grade','Sixth grade'][S.grade]);return}
  const s=e.target.closest('[data-s]');if(s){SC.subj=s.dataset.s;SC.streak=0;SFX.pop();nextQ();return}
  if(e.target.closest('#toSubjects')){clearTimeout(nextTimer);hush();SC.subj=null;SC.q=null;SC.streak=0;streakPill();SFX.pop();renderBoard();return}
  if(e.target.closest('#sayAgain')){readQ();return}
  if(e.target.closest('#nextBtn')){clearTimeout(nextTimer);hush();nextQ();return}
});
const PRAISE=['Great job!','You got it!','Yes!','Super!','Nice work!',"That's right!",'Awesome!','Correct!'];
$('#answers').addEventListener('click',e=>{
  const btn=e.target.closest('.ans');if(!btn||SC.locked)return;audioInit();
  const q=SC.q,c=q.ch[+btn.dataset.i];const p=P();
  if(!c.ok){
    btn.classList.add('wrong');SFX.boop();say('Hmm. Try again!');
    if(!SC.missed){SC.missed=true;if((SC.streak||0)>=3)toast('star',`Streak ended at ${SC.streak}. Keep going!`);SC.streak=0;streakPill()}
    const me=SC.seats.findIndex(s=>s.role==='me');seatExpr(me,'ok',600);return;
  }
  SC.locked=true;btn.classList.add('right');
  const first=!SC.missed;
  if(first){SC.streak=(SC.streak||0)+1;if(SC.streak>(S.bestStreak||0))S.bestStreak=SC.streak}
  const st=SC.streak||0;
  // pitch climbs with the streak
  [784,988,1175,1568].forEach((f,i)=>tone(f*Math.pow(1.06,Math.min(first?st:0,12)),.32,'sine',.2,null,i*.08));
  const r=btn.getBoundingClientRect(),a=appXY(r.left+r.width/2,r.top);sparkles(a.x,a.y,10+Math.min(st,10)*2,st>=5?'#FF8A3D':'#FFC83D');
  SC.seats.forEach((s,i)=>setTimeout(()=>{anim(s.el.querySelector('.who'),st>=5&&first?'a-jump':'a-bounce',700);seatExpr(i,'happy',1300)},i*70));
  const me=$('#desks .seat.me');if(me){const mr=me.getBoundingClientRect(),m=appXY(mr.left+mr.width/2,mr.top);hearts(m.x,m.y,2+Math.min(st,6))}
  setTimeout(()=>babble(p,'happy',2),900);
  // rewards
  const mult=q.bonus?2:1;
  gain(SC.subj,2*mult);addNeed('fun',2);addNeed('energy',-.5);
  eggFill(.2*mult+(first&&st>=5?.3:0));grow(1.5*mult,'school');S.coins=(S.coins||0)+(q.bonus?5:1);$$('.coin-count').forEach(el=>el.textContent=S.coins);
  S.right=S.right||{};const rk=`${SC.subj}:${q.grade}`;S.right[rk]=(S.right[rk]||0)+1;
  if(first&&q.bank){S.done=S.done||[];if(!S.done.includes(q.bank)){S.done.push(q.bank);
    const size=bankSize(SC.subj,q.grade);if(size&&bankDone(SC.subj,q.grade)===size)setTimeout(()=>{banner(starsHTML(3),'Subject mastered!',`Every ${subjName[SC.subj]} question for ${GRADES[q.grade]}`,3600);say(`Wow! You answered every ${subjName[SC.subj]} question for ${GRADES[q.grade]}!`)},900)}}
  const rec=p.school[SC.subj];rec.c++;
  let gotSticker=false;
  if(q.bonus){rec.st++;gotSticker=true}else if(rec.c%5===0){rec.st++;gotSticker=true}
  stickerPill();streakPill();save();
  // what the teacher says
  let line=pick(PRAISE);
  if(first&&[3,5,10,15,20,25,30,40,50].includes(st))line=st===3?'Three in a row!':st===5?"Five in a row! You're on fire!":st===10?'Ten in a row! Amazing!':`${st} in a row! Incredible!`;
  if(q.bonus)line='Bonus question solved! You earned a gold sticker!';
  if(first&&st>=3){const pill=$('#streakPill');anim(pill,'a-bounce',600)}
  const why=q.why;
  if(why){const w=$('#why');w.hidden=false;w.innerHTML=`${BULB}<span></span><button class="chalk-btn next-btn" id="nextBtn">Next ›</button>`;w.querySelector('span').textContent=why}
  say(why?[line,why]:line);
  if(gotSticker&&!q.bonus){const n=SUBJECTS.reduce((a,k)=>a+p.school[k].st,0);setTimeout(()=>banner(stickerSVG(n-1),'New sticker!',`${subjName[SC.subj]} · ${rec.st} so far`,2400),500)}
  if(q.bonus){const n=SUBJECTS.reduce((a,k)=>a+p.school[k].st,0);setTimeout(()=>banner(stickerSVG(n-1),'Gold sticker!','Bonus question solved',2400),500)}
  const wait=why?Math.max(3200,1700+(line.length+why.length)*62):(gotSticker?2600:1400+line.length*20);
  nextTimer=setTimeout(()=>{if(scene==='school'&&SC.subj)nextQ()},wait);
});

function enterNest(){

function renderNest(){
  const g=$('#nestGrid');let h='';
  for(let i=0;i<S.eggs;i++)h+=`<button class="ncard" data-egg="1"><div class="mini" style="align-items:center"><div class="egg">${eggSVG((i*97+40)%360)}</div></div><b>New egg</b><small>Tap to hatch</small></button>`;

function drawCoin(ctx,x,y,r,t){
  const sx=Math.abs(Math.cos(t*3+x*.01))*.8+.2;
  ctx.save();ctx.translate(x,y);ctx.scale(sx,1);

}
function rrect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function lerpC(a,b,t){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function skyGrad(ctx,H,top,bot){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);return g}

function partsStep(ctx,dt,g=600){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];if(p.txt)continue;p.t+=dt;if(p.t>p.life){PARTS.splice(i,1);continue}p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function floatText(x,y,txt,col='#fff'){PARTS.push({x,y,vx:0,vy:-90,life:.9,t:0,txt,col,r:0})}
function textParts(ctx,dt){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];if(!p.txt)continue}}

/* ---------- Sky Hop ---------- */
const HOP={
 init(G){
  const fw=Math.min(G.W,G.H*.72);this.fw=fw;this.ox=(G.W-fw)/2;const u=this.u=Math.min(fw/400,G.H/720);
  this.px=fw/2;this.y0=G.H-60*u;this.py=this.y0;this.vx=0;this.vy=-950*u;this.cam=0;this.minY=this.py;
  this.plats=[{x:fw/2-70*u,y:G.H-40*u,w:140*u,t:'n'}];this.coinL=[];this.lastY=G.H-40*u;this.dir=1;this.sq=0;
  this.stars=W(60).map(()=>[Math.random(),Math.random(),rand(.6,2)]);this.clouds=W(8).map(()=>[Math.random(),Math.random()*G.H*2,rand(.6,1.4)]);
  this.fill(G);
 },
 sc(){return Math.max(0,Math.floor((this.y0-this.minY)/(8*this.u)))},
 fill(G){
  const u=this.u;
  while(this.lastY>this.cam-300*u){
   const sc=this.sc();const gap=Math.min(205,78+sc*.055)*u*rand(.72,1);
   const y=this.lastY-gap;const w=rand(68,86)*u*(sc>2500?.85:1);const x=rand(0,this.fw-w);
   const r=Math.random();let t='n';
   const pm=clamp((sc-250)/2500,0,.32),pc=clamp((sc-500)/3200,0,.22);
   if(r<pm)t='m';else if(r<pm+pc)t='c';
   const pl={x,y,w,t,dx:(Math.random()<.5?-1:1)*rand(55,110)*u,spring:t!=='c'&&Math.random()<.065};
   this.plats.push(pl);
   if(Math.random()<.35&&!pl.spring)this.coinL.push({x:x+w/2,y:y-30*u,got:false});
   this.lastY=y;
  }
 },
 update(G,dt){
  const u=this.u;
  // steer
  // steer by sliding: the pet moves as much as your finger moves, wherever you touch
  if(G.ptr.down){if(this.lastPX==null)this.lastPX=G.ptr.x;const mv=(G.ptr.x-this.lastPX)*1.4;this.lastPX=G.ptr.x;this.px+=mv;if(Math.abs(mv)>.5)this.dir=Math.sign(mv)}
  else{this.lastPX=null;if(G.keys.left)this.vx-=2600*u*dt;if(G.keys.right)this.vx+=2600*u*dt;this.vx=clamp(this.vx*Math.pow(.02,dt),-520*u,520*u);this.px+=this.vx*dt;if(Math.abs(this.vx)>20)this.dir=Math.sign(this.vx)}
  if(this.px<0)this.px+=this.fw;if(this.px>this.fw)this.px-=this.fw;
  const oy=this.py;this.vy+=2000*u*dt;this.vy=Math.min(this.vy,1300*u);this.py+=this.vy*dt;
  for(const p of this.plats){
   if(p.t==='m'){p.x+=p.dx*dt;if(p.x<0||p.x+p.w>this.fw)p.dx*=-1}
   if(p.broke){p.y+=300*u*dt;continue}
   if(this.vy>0&&oy<=p.y+2&&this.py>=p.y&&Math.abs(this.px-(p.x+p.w/2))<p.w/2+14*u){
    this.py=p.y;this.vy=p.spring?-1650*u:-1000*u;this.sq=1;
    if(p.spring){tone(300,.4,'sine',.3,1200);burstAt(this.ox+this.px,p.y-this.cam,'#E33B2E',8)}else tone(220+Math.min(600,this.sc()*.1),.12,'sine',.22,520);
    if(p.t==='c'){p.broke=true;noise(.15,.3,900)}
   }
  }
  this.minY=Math.min(this.minY,this.py);
  const sy=this.py-this.cam;if(sy<G.H*.42)this.cam=this.py-G.H*.42;
  for(const c of this.coinL)if(!c.got&&Math.hypot(c.x-this.px,c.y-(this.py-30*u))<34*u){c.got=true;gCoin();burstAt(this.ox+c.x,c.y-this.cam,'#FFC83D',6)}
  this.plats=this.plats.filter(p=>p.y-this.cam<G.H+80*u);this.coinL=this.coinL.filter(c=>c.y-this.cam<G.H+80*u);
  this.fill(G);this.sq=Math.max(0,this.sq-dt*5);
  gScore(this.sc());
  if(this.py-this.cam>G.H+60*u)return 'over';
 },
 draw(G,ctx,dt){
  const u=this.u,sc=this.sc(),cam=this.cam;
  const stops=[[0,'#9FD8F5','#E8F6FC'],[1500,'#F7B58A','#FCE3C2'],[3000,'#3A3F8C','#7A5FB0'],[4500,'#10123A','#2A2560']];
  let i=0;while(i<stops.length-2&&sc>stops[i+1][0])i++;const a=stops[i],b=stops[i+1];const t=clamp((sc-a[0])/(b[0]-a[0]),0,1);
  ctx.fillStyle=skyGrad(ctx,G.H,lerpC(a[1],b[1],t),lerpC(a[2],b[2],t));ctx.fillRect(0,0,G.W,G.H);
  if(sc>2200){ctx.globalAlpha=clamp((sc-2200)/1000,0,1);ctx.fillStyle='#fff';for(const s of this.stars){const y=((s[1]*G.H-cam*.05)%G.H+G.H)%G.H;ctx.fillRect(s[0]*G.W,y,s[2],s[2])}ctx.globalAlpha=1}
  ctx.fillStyle='rgba(255,255,255,.55)';for(const c of this.clouds){const y=((c[1]-cam*.3)%(G.H*2)+G.H*2)%(G.H*2)-G.H*.5;const x=c[0]*G.W;ctx.beginPath();ctx.ellipse(x,y,60*u*c[2],20*u*c[2],0,0,7);ctx.ellipse(x+30*u*c[2],y-12*u*c[2],34*u*c[2],22*u*c[2],0,0,7);ctx.fill()}
  if(this.ox>0){ctx.fillStyle='rgba(43,33,64,.12)';ctx.fillRect(0,0,this.ox,G.H);ctx.fillRect(this.ox+this.fw,0,this.ox,G.H)}
  ctx.save();ctx.translate(this.ox,0);
  for(const p of this.plats){
   const y=p.y-cam;const h=16*u;ctx.globalAlpha=p.broke?.5:1;
   ctx.fillStyle=p.t==='m'?'#A9DCF2':p.t==='c'?'#E9CFA0':'#FFFFFF';ctx.strokeStyle='#2B2140';ctx.lineWidth=3*u;
   rrect(ctx,p.x,y,p.w,h,h/2);ctx.fill();ctx.stroke();
   if(p.t==='c'){ctx.beginPath();ctx.moveTo(p.x+p.w*.4,y);ctx.lineTo(p.x+p.w*.48,y+h*.6);ctx.lineTo(p.x+p.w*.42,y+h);ctx.stroke()}
   if(p.spring){const sx=p.x+p.w/2;ctx.strokeStyle='#E33B2E';ctx.lineWidth=4*u;ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(sx-9*u,y-4*u-k*5*u);ctx.lineTo(sx+9*u,y-6.5*u-k*5*u)}ctx.stroke();ctx.fillStyle='#E33B2E';rrect(ctx,sx-13*u,y-26*u,26*u,6*u,3*u);ctx.fill()}
   ctx.globalAlpha=1;
  }
  for(const c of this.coinL)if(!c.got)drawCoin(ctx,c.x,c.y-cam,11*u,G.t);
  const sq=this.sq;const sz=84*u;
  for(const wx of [0,-this.fw,this.fw])drawPet(ctx,this.px+wx,this.py-cam,sz,{flip:this.dir<0,sx:1+sq*.18,sy:1-sq*.22,expr:this.vy<0?'happy':'ok'});
  ctx.restore();
  partsStep(ctx,dt);
 },
 down(G){},
 coinsEarned(){return GM.coins+Math.floor(GM.score/40)}
};

const BASH_PATTERNS=[

];
const BASH_COL=['#E8735A','#FFC83D','#5FD0B8','#5B8DEF','#8E5BD8','#F27BB0','#FF8A3D'];
const BASH={
 init(G){
  const fw=Math.min(G.W,G.H*.75);this.fw=fw;this.ox=(G.W-fw)/2;const u=this.u=fw/400;

/* ---------- Dash ---------- */
const DASH={

  const m=this.m();this.spd=Math.min(this.spd0*1.75,this.spd0*(1+m/1600));const dx=this.spd*dt;this.dist+=dx;this.bg+=dx;
  let g=2600*u;if(G.ptr.down||G.keys.space||G.keys.up){if(this.hold>0&&this.vy<0)g*=.45}this.hold-=dt;
  this.vy+=g*dt;this.y+=this.vy*dt;this.spin=Math.max(0,this.spin-dt*2.2);
  if(this.y>=this.gy&&!this.overPit()){if(this.vy>0){this.y=this.gy;this.vy=0;this.jumps=0}}
  if(this.y>G.H+80*u)return 'over';
  // spawn
  this.next-=dx;
  if(this.next<=0){
   const r=Math.random(),opts=['rock','rock','log'];if(m>120)opts.push('cactus');if(m>260)opts.push('bush');if(m>420)opts.push('pit','pit');if(m>600)opts.push('bird');
   const t=pick(opts);const X=G.W+40*u;
   const D={rock:[44,36],log:[90,30],cactus:[34,70],bush:[80,44],bird:[54,30]};
   if(t==='pit')this.pits.push({x:X,w:rand(110,165)*u});
   else{const [w,h]=D[t];this.obs.push({t,x:X,w:w*u,h:h*u,y:t==='bird'?this.gy-rand(84,100)*u-h*u:this.gy-h*u})}
   if(Math.random()<.4){const cx=X+rand(140,240)*u;for(let k=0;k<5;k++)this.coinL.push({x:cx+k*34*u,y:this.gy-70*u-Math.sin(k/4*Math.PI)*70*u})}

  }
  for(const o of this.obs)o.x-=dx;for(const p of this.pits)p.x-=dx;for(const c of this.coinL)c.x-=dx;
  this.obs=this.obs.filter(o=>o.x>-150*u);this.pits=this.pits.filter(p=>p.x>-250*u);this.coinL=this.coinL.filter(c=>c.x>-40*u&&!c.got);

  for(const c of this.coinL)if(Math.abs(c.x-this.x)<26*u&&Math.abs(c.y-(this.y-30*u))<34*u){c.got=true;gCoin()}
  gScore(this.m());
 },
 draw(G,ctx,dt){

  const em=shuffle(MEM_EMO).slice(0,pairs);const cards=shuffle([...em,...em]);

}

function dropToy(id){
  closeTray();if(R.lock)return;if(R.state==='sleep'||R.state==='tobed')wake(true);if(R.state==='bath')endBath(false);
  if(R.toy&&R.toy.el)R.toy.el.remove();
  const x=clamp(R.x+(R.x>.5?-1:1)*rand(.25,.4),.08,.92);
  const el=document.createElement('div');el.className='room-toy';el.innerHTML=iconOf(id);room.appendChild(el);
  R.toy={id,x,el,t:0};placeToy();SFX.pop();
  R.state='walk';R.tx=x+(x>R.x?-.1:.1);R.toyGo=true;
