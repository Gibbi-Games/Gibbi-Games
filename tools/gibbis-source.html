/* ---------- Sky Hop ---------- */
const HOP={
 init(G){
  const fw=Math.min(G.W,G.H*.72);this.fw=fw;this.ox=(G.W-fw)/2;const u=this.u=Math.min(fw/400,G.H/720);
  this.px=fw/2;this.y0=G.H-60*u;this.py=this.y0;this.vx=0;this.vy=-950*u;this.cam=0;this.minY=this.py;
  this.plats=[{x:fw/2-70*u,y:G.H-40*u,w:140*u,t:'n'}];this.coinL=[];this.lastY=G.H-40*u;this.dir=1;this.sq=0;
  this.stars=W(60).map(()=>[Math.random(),Math.random(),rand(.6,2)]);this.clouds=W(8).map(()=>[Math.random(),Math.random()*G.H*2,rand(.6,1.4)]);
  this.fill(G);
 },
 sc(){return Math.max(0,Math.floor((this.y0-this.minY)/(8*this.u)))},
 fill(G){
  const u=this.u;
  while(this.lastY>this.cam-300*u){
   const sc=this.sc();const gap=Math.min(205,78+sc*.055)*u*rand(.72,1);
   const y=this.lastY-gap;const w=rand(68,86)*u*(sc>2500?.85:1);const x=rand(0,this.fw-w);
   const r=Math.random();let t='n';
   const pm=clamp((sc-250)/2500,0,.32),pc=clamp((sc-500)/3200,0,.22);
   if(r<pm)t='m';else if(r<pm+pc)t='c';
   const pl={x,y,w,t,dx:(Math.random()<.5?-1:1)*rand(55,110)*u,spring:t!=='c'&&Math.random()<.065};
   this.plats.push(pl);
   if(Math.random()<.35&&!pl.spring)this.coinL.push({x:x+w/2,y:y-30*u,got:false});
   this.lastY=y;
  }
 },
 update(G,dt){
  const u=this.u;
  // steer
  // steer by sliding: the pet moves as much as your finger moves, wherever you touch
  if(G.ptr.down){if(this.lastPX==null)this.lastPX=G.ptr.x;const mv=(G.ptr.x-this.lastPX)*1.4;this.lastPX=G.ptr.x;this.px+=mv;if(Math.abs(mv)>.5)this.dir=Math.sign(mv)}
  else{this.lastPX=null;if(G.keys.left)this.vx-=2600*u*dt;if(G.keys.right)this.vx+=2600*u*dt;this.vx=clamp(this.vx*Math.pow(.02,dt),-520*u,520*u);this.px+=this.vx*dt;if(Math.abs(this.vx)>20)this.dir=Math.sign(this.vx)}
  if(this.px<0)this.px+=this.fw;if(this.px>this.fw)this.px-=this.fw;
  const oy=this.py;this.vy+=2000*u*dt;this.vy=Math.min(this.vy,1300*u);this.py+=this.vy*dt;
  for(const p of this.plats){
   if(p.t==='m'){p.x+=p.dx*dt;if(p.x<0||p.x+p.w>this.fw)p.dx*=-1}
   if(p.broke){p.y+=300*u*dt;continue}
   if(this.vy>0&&oy<=p.y+2&&this.py>=p.y&&Math.abs(this.px-(p.x+p.w/2))<p.w/2+14*u){
    this.py=p.y;this.vy=p.spring?-1650*u:-1000*u;this.sq=1;
    if(p.spring){tone(300,.4,'sine',.3,1200);burstAt(this.ox+this.px,p.y-this.cam,'#E33B2E',8)}else tone(220+Math.min(600,this.sc()*.1),.12,'sine',.22,520);
    if(p.t==='c'){p.broke=true;noise(.15,.3,900)}
   }
  }
  this.minY=Math.min(this.minY,this.py);
  const sy=this.py-this.cam;if(sy<G.H*.42)this.cam=this.py-G.H*.42;
  for(const c of this.coinL)if(!c.got&&Math.hypot(c.x-this.px,c.y-(this.py-30*u))<34*u){c.got=true;gCoin();burstAt(this.ox+c.x,c.y-this.cam,'#FFC83D',6)}
  this.plats=this.plats.filter(p=>p.y-this.cam<G.H+80*u);this.coinL=this.coinL.filter(c=>c.y-this.cam<G.H+80*u);
  this.fill(G);this.sq=Math.max(0,this.sq-dt*5);
  gScore(this.sc());
  if(this.py-this.cam>G.H+60*u)return 'over';
 },
 draw(G,ctx,dt){
  const u=this.u,sc=this.sc(),cam=this.cam;
  const stops=[[0,'#1BBEEE','#BBEEEE'],[1500,'#2CA9D3','#F8E58C'],[3000,'#193B95','#4E3F9E'],[4500,'#0B0D14','#2A2560']];

GM.resize=()=>{
  const el=$('#game'),r=el.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  GM.W=r.width;GM.H=r.height;GM.dpr=dpr;const c=$('#gc');c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.style.width=r.width+'px';c.style.height=r.height+'px';
  GM.ctx=c.getContext('2d');GM.ctx.setTransform(dpr,0,0,dpr,0,0);
};
function updGHud(){$('#gScore').textContent=GM.score+(GAME[GM.id].unit||'');$('#gCoins').textContent=GM.coins}
function beginPlay(){$('#gameReady').hidden=true;GM.state='play';audioInit()}
function gameOver(quit){
  if(GM.state==='over')return;GM.state='over';const p=P();const id=GM.id,g=GAME[id];
  p.best=p.best||{};const prev=bestOf(p,id);const isBest=GM.score>prev;if(isBest)p.best[id]=GM.score;
  const earned=Math.max(0,Math.round(GM.cur.coinsEarned()));S.coins=(S.coins||0)+earned;
  S.plays=(S.plays||0)+1;addNeed('fun',Math.min(25,6+GM.playT));
  save();
  const goal=nextGoal(p,id);
  const ov=$('#gameOver');ov.hidden=false;
  ov.innerHTML=`<div class="ocard"><div class="omini">${petSVG(p,isBest||GM.newUnlocks.length?'happy':'ok')}</div>
   <b class="oscore">${GM.score}${g.unit}</b><span class="obest">${isBest&&GM.score>0?'New best!':`Best: ${Math.max(prev,GM.score)}${g.unit}`}</span>
   <span class="ocoins">${COIN_SVG}+${earned} coins</span>
   ${GM.newUnlocks.map(u=>`<span class="ounlock">Unlocked: ${esc(ITEM[u].name)}! Wear it from the shop.</span>`).join('')}
   ${goal?`<div class="gprog"><i style="width:${Math.round(clamp(Math.max(prev,GM.score)/goal.game[1],0,1)*100)}%"></i></div><small>Score ${goal.game[1]}${g.unit} to win ${esc(goal.name)}</small>`:''}
   <div class="obtns"><button class="obtn alt" id="oArcade">Games</button><button class="obtn" id="oAgain">Play again</button></div>${Math.max(prev,GM.score)>0?`<button class="link-btn" id="oChal">Challenge a friend</button>`:''}</div>`;
  $('#oAgain').onclick=()=>{SFX.pop();startGame(id)};if($('#oChal'))$('#oChal').onclick=()=>{SFX.pop();openShare({kind:'challenge',game:id})};$('#oArcade').onclick=()=>{SFX.pop();enterArcade()};
  if(isBest&&GM.score>0){SFX.chime();sparkles(GM.W/2,GM.H*.35,20);say(`New best! ${GM.score}${g.unit==='m'?' meters':''}!`)}
  else if(!quit)say(pick(['Nice try!','Good game!','So close!','Play again?']));
  setTimeout(()=>babble(p,isBest?'happy':'ask',3),600);
  updGHud();
}
function gameTick(dt){
  if(!GM.cur)return;GM.t+=dt;
  const ctx=GM.ctx;
  if(GM.state==='play'){
    GM.playT+=dt;
    if(Math.floor(GM.playT/4)>Math.floor((GM.playT-dt)/4)){grow(1,'g'+GM.id);GAME[GM.id].paths.forEach(k=>gain(k,1))}
    const r=GM.cur.update(GM,dt);if(r==='over'){gameOver();}
  }
  if(GM.id!=='memory'&&ctx){ctx.save();GM.cur.draw(GM,ctx,dt);
    for(const p of PARTS)if(p.txt){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.font=`900 ${28*GM.H/800}px Outfit,sans-serif`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y);p.y+=p.vy*dt;p.t+=dt}
    for(let i=PARTS.length-1;i>=0;i--)if(PARTS[i].txt&&PARTS[i].t>PARTS[i].life)PARTS.splice(i,1);
    ctx.globalAlpha=1;ctx.restore()}
  updGHud();
}
const gEl=$('#game');
function gXY(e){const r=gEl.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
gEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')&&!e.target.closest('.mcard'))return;audioInit();
  const m=e.target.closest('.mcard');
  if(GM.state==='ready'){beginPlay();if(GM.id==='dash')GM.cur.down(GM);return}
  if(GM.state!=='play')return;
  if(m){GM.cur.flip(m);return}
  const {x,y}=gXY(e);GM.ptr.down=true;GM.ptr.x=x;GM.ptr.y=y;try{gEl.setPointerCapture(e.pointerId)}catch(_){}
  GM.cur.down&&GM.cur.down(GM,x,y);
});
gEl.addEventListener('pointermove',e=>{if(!GM.ptr.down&&GM.id!=='drop')return;const {x,y}=gXY(e);GM.ptr.x=x;GM.ptr.y=y;if(GM.id==='drop'&&e.pointerType==='mouse'&&GM.state==='play')GM.cur.dx=x});
const gUp=e=>{if(!GM.ptr.down)return;GM.ptr.down=false;if(GM.state==='play'&&GM.cur.up)GM.cur.up(GM)};
gEl.addEventListener('pointerup',gUp);gEl.addEventListener('pointercancel',e=>{GM.ptr.down=false});
$('#gameHome').onclick=()=>{audioInit();SFX.pop();if(GM.state==='play'&&GM.score>0)gameOver(true);else enterArcade()};
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',' ':'space',a:'left',d:'right',w:'up'};
window.addEventListener('keydown',e=>{if(scene!=='game')return;const k=KEYMAP[e.key];if(!k)return;e.preventDefault();if(GM.state==='ready'){beginPlay();if(GM.id==='dash'){GM.cur.key&&GM.cur.key(k)}return}if(GM.state!=='play')return;if(!GM.keys[k]&&GM.cur.key)GM.cur.key(k);GM.keys[k]=true});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)GM.keys[k]=false});

function foodReact(food,c,m){
  const it=ITEM[food];if(!it)return false;
  switch(it.react){
    case 'crunch':temp('happy',1200);anim(petAnim,'a-bounce',550);for(let i=0;i<6;i++)spawn(`<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#C7874A"/></svg>`,m.x,m.y,'burst',700,{dx:rand(-60,60),dy:rand(10,50),size:rand(6,10)});noise(.2,.3,2500);break;
    case 'brainfreeze':temp('cold',1800);anim(petAnim,'a-shake',500);setTimeout(()=>anim(petAnim,'a-shake',500),550);popParticles(c.x,c.top,'a-cloud',5);sayText('Brrr!',c.x,c.top);tone(1400,.6,'sine',.08,700);break;
    case 'sour':temp('sour',1600);anim(petAnim,'a-wiggle',500);sayText('Sour!',c.x,c.top);tone(900,.3,'square',.06,1600);break;
    case 'sticky':temp('happy',1500);sparkles(c.x,c.y,10,'#E8A92C');sayText('Yum!',c.x,c.top);SFX.purr();break;
    case 'pop':temp('giggle',2000);for(let i=0;i<4;i++)setTimeout(()=>{anim(petAnim,'a-jump',600);tone(800+i*200,.06,'square',.1);popParticles(c.x,c.top+20,'popcorn',2,90)},i*420);break;
    case 'seeds':temp('giggle',1600);for(let i=0;i<6;i++)setTimeout(()=>{spawn(`<svg viewBox="0 0 10 14"><ellipse cx="5" cy="7" rx="3.5" ry="6" fill="#121417"/></svg>`,m.x,m.y,'burst',800,{dx:R.dir*rand(90,180),dy:rand(-60,-10),size:12});tone(1200,.04,'sine',.1)},i*160);break;

    default:temp('happy',1200);anim(petAnim,'a-bounce',550);hearts(c.x,c.top+20,3);SFX.pop();

  tr.hidden=false;tr.dataset.mode='toys';setToolOn('toys',true);$('#playBar').hidden=true;

function dropToy(id){
  closeTray();if(R.lock)return;if(R.state==='sleep'||R.state==='tobed')wake(true);if(R.state==='bath')endBath(false);
  if(R.toy&&R.toy.el)R.toy.el.remove();
  const x=clamp(R.x+(R.x>.5?-1:1)*rand(.25,.4),.08,.92);
  const el=document.createElement('div');el.className='room-toy';el.innerHTML=iconOf(id);room.appendChild(el);
  R.toy={id,x,el,t:0};placeToy();SFX.pop();
  R.state='walk';R.tx=x+(x>R.x?-.1:.1);R.toyGo=true;
}
function placeToy(){const t=R.toy;if(!t)return;const px=L.minX+t.x*(L.maxX-L.minX);t.el.style.left=px+'px';t.el.style.bottom=(L.bottom+6)+'px';t.el.style.fontSize=Math.round(L.size*.32)+'px'}
function playToy(){
  const t=R.toy;if(!t)return;const it=ITEM[t.id];R.state='toyplay';R.dir=t.x>R.x?1:-1;
  const c=petCenter();let ms=2800;const tel=t.el;
  const toyAnim=(cls,ms2)=>{tel.classList.remove(cls);void tel.offsetWidth;tel.classList.add(cls);setTimeout(()=>tel.classList.remove(cls),ms2)};
  switch(it.play){
    case 'squeak':for(let i=0;i<3;i++)setTimeout(()=>{toyAnim('t-squish',300);SFX.squeak();temp('giggle',600)},i*700);break;
    case 'roll':toyAnim('t-roll',2400);anim(petAnim,'a-roll',1600);temp('giggle',2400);SFX.giggle();break;
    case 'stack':for(let i=0;i<3;i++)setTimeout(()=>{spawn(`<b class="numpop">${i+1}</b>`,c.x+R.dir*50,c.top+20,'float',1300,{size:40});tone(523*Math.pow(1.26,i),.2,'triangle',.18)},i*600);temp('happy',2400);break;
    case 'yoyo':toyAnim('t-yoyo',2400);temp('happy',2400);anim(petAnim,'a-bounce',550);break;
    case 'drum':for(let i=0;i<6;i++)setTimeout(()=>{noise(.08,.5,180+i%2*120,0,2);toyAnim('t-squish',200);anim(petAnim,'a-bounce',300)},i*330);temp('giggle',2200);break;
    case 'cuddle':temp('sleep',2600);hearts(c.x,c.top,5);SFX.purr();toyAnim('t-squish',400);break;
    case 'read':temp('ok',2800);setTimeout(()=>babble(P(),'ask',4),300);for(let i=0;i<3;i++)setTimeout(()=>spawn(`<b style="font-size:34px;color:#FEFEF6">${'ABC'[i]}</b>`,c.x+rand(-30,30),c.top,'float',1200),i*500);break;
    case 'stars':temp('happy',2600);setTimeout(()=>sparkles(c.x,c.top-40,16,'#FFE07A'),600);sayText('Wow!',c.x,c.top);break;
    case 'spin':toyAnim('t-spin',2400);temp('happy',2400);sayText('Whee!',c.x,c.top);break;
    case 'skate':ms=2600;R.skate=true;temp('giggle',2600);SFX.whoosh();tel.style.opacity='0';break;
    case 'toot':for(let i=0;i<3;i++)setTimeout(()=>{tone(392*Math.pow(1.122,i*2),.3,'sawtooth',.08);spawn('♪',c.x+R.dir*60,c.top+20,'float',1100,{dx:R.dir*40,style:{fontSize:'34px',color:'#FEFEF6'}})},i*500);temp('happy',2000);break;
  }
  gain(it.path,3);addNeed('fun',14);
  setTimeout(()=>{if(R.toy===t){t.el.style.transition='opacity .4s';t.el.style.opacity='0';setTimeout(()=>t.el.remove(),400);R.toy=null}R.skate=false;if(R.state==='toyplay')R.state='idle';grow(2.5,'toy:'+t.id);save()},ms);
}

/* greeting when you come back */
function greetBack(){
  const p=P();const away=Date.now()-(S.lastSeen||0);S.lastSeen=Date.now();
  if(away<90*1000)return;
  R.x=.5;R.tx=.5;
  setTimeout(()=>{if(scene!=='room')return;const c=petCenter();anim(petAnim,'a-jump',700);temp('happy',2500);hearts(c.x,c.top,6);babble(p,'happy',5);
    const h=new Date().getHours();const line=away>8*3600*1000&&h<11?`Good morning! ${p.name} missed you!`:pick([`${p.name} missed you!`,`${p.name} is so happy to see you!`,`Look who's back!`]);
    setTimeout(()=>say(line),900)},450);
}

function previewItemHTML(it,big){

  if(it.kind==='flooring')return `<div class="iswatch" style="background:${FLOORS[it.id].replace(/"/g,'&quot;')}"></div>`;
  if(it.kind==='fx'){const d=FX_DEF[it.id];return `<div class="iswatch fxsw" style="background:linear-gradient(#2CA9D3,#193B95)">${d?[[18,22],[60,14],[36,52],[78,58],[12,70],[52,80]].map(([x,y],k)=>`<i class="${d.cls}" style="left:${x}%;top:${y}%;--z:.8;--h:${k*60}">${d.ch||''}</i>`).join(''):'<b style="color:#FEFEF6;font-size:18px">Off</b>'}</div>`}

  if(it.kind==='theme'){const t=it.set;const em=t.items.map(i=>i[0]).filter(id=>ART[id]).slice(0,3).map(id=>artSVG(id));return `<div class="iswatch themesw" style="background:${WALLS[t.wall].replace(/"/g,'&quot;')}"><div class="tfl" style="background:${FLOORS[t.flooring].replace(/"/g,'&quot;')}"></div><div class="tem">${em.map(e=>`<span>${e}</span>`).join('')}</div></div>`}
  if(it.kind==='rug')return `<div class="iswatch rugsw${it.hex?' hexsw':''}" style="background:${RUGS[it.id].replace(/"/g,'&quot;')}"></div>`;
  if(DECO_SPECIAL[it.id]&&it.kind!=='bed'&&it.id!=='a-shelf'){const ar=it.ar||1,hh=Math.min(64,92/ar);return `<div class="iemo dsp"><div class="deco-prev" style="width:${hh*ar}px;height:${hh}px;font-size:${hh*.92}px">${DECO_SPECIAL[it.id]()}</div></div>`}
  if(it.kind==='rug')return `<div class="iswatch rugsw" style="background:${RUGS[it.id].replace(/"/g,'&quot;')}"></div>`;
  if(it.kind==='view')return `<div class="iswatch win" data-view="${it.id}"><div class="sky"></div><div class="sun"></div>${VIEWS[it.id]||''}</div>`;
  if(it.kind==='bed')return `<div class="iswatch bedsw"><div class="bedprev">${bedSVG(it.id)}</div></div>`;

  }

  if(WEAR_KINDS.includes(it.kind)){p.wear=p.wear||{};if(p.wear[it.kind]===it.id&&s==='owned')delete p.wear[it.kind];else p.wear[it.kind]=it.id;SH.try=null;babble(p,'happy',3)}

  else if(it.kind==='theme'&&s==='owned'){save();enterDecorate('theme');askTheme(it.id);return}
  else if(it.kind==='place'){save();enterRoom();goRoom(it.room);return}
  save();renderShop();
});

/* ================= TOY PLAY (in the room) ================= */
const TOY_MODE={ball:'throw',duck:'throw',yarn:'throw',teddy:'throw',feather:'wand',yoyo:'wand',bubbles:'bubbles',drum:'music',trumpet:'music',blocks:'stack',book:'book',scope:'scope',globe:'globe',skate:'ride'};
const TOY_HINT={throw:'Flick the toy! Your Gibbi will fetch it.',wand:'Hold and wiggle. Can your Gibbi catch it?',bubbles:'Tap to blow bubbles!',music:'Tap the toy to the beat!',stack:'Tap to stack blocks!',book:'Tap to read a word!',scope:'Tap to look at the stars!',globe:'Spin the globe!',ride:'Flick sideways to skate!'};
const TOY_PHYS={ball:[.74,.55],duck:[.5,.35],yarn:[.25,.82],teddy:[.12,.15]};
const RP=()=>R.play;
function petGeo(){const sc=petScale(P().level);return {px:petPx(),sc,h:L.size*sc*.6,w:L.size*sc*.5,floor:L.H-L.bottom}}
function petGoPx(x,spd,dt){const t=clamp((x-L.minX)/(L.maxX-L.minX),0,1);const d=t-R.x;if(Math.abs(d)<.004)return 0;R.mv=.12;R.dir=Math.sign(d);R.x+=Math.sign(d)*Math.min(Math.abs(d),spd*dt*(isSad()?.6:1));return Math.abs(d)}
function petHop(v){if(R.lift>0||R.jv)return false;R.jv=v;return true}
function toyEl(id,cls='play-toy'){const el=document.createElement('div');el.className=cls;el.innerHTML=iconOf(id);room.appendChild(el);return el}
function placeEl(el,x,y,r,rot=0,sx=1){el.style.fontSize=(r*1.6)+'px';el.style.width=el.style.height=(r*2)+'px';el.style.transform=`translate(${x-r}px,${y-r}px) rotate(${rot}rad) scale(${sx})`}
function toyReward(id,n=1){const it=ITEM[id]||{path:'brave'};grow(.7*n,'toy:'+id);gain(it.path||'brave',1*n);addNeed('fun',4*n);R.idleT=0}
function payCoin(n=1){S.coins=(S.coins||0)+n;$$('.coin-count').forEach(el=>el.textContent=S.coins)}

function enterPlay(id){
  closeTray();if(R.lock)return;if(R.state==='sleep'||R.state==='tobed')wake(true);if(R.state==='bath')endBath(false);
  exitPlay(true);
  if(S.mode==='survival'&&P().sick){toast('meds',`${P().name} is sick. Try medicine first.`);return}
  const mode=TOY_MODE[id]||'throw';const g=petGeo();const r=L.size*.13;
  const x=clamp(g.px+(R.x>.5?-1:1)*L.W*.25,r+10,L.W-r-10);
  R.play={id,mode,x,y:g.floor-r,vx:0,vy:0,r,rot:0,st:'rest',el:null,samples:[],home:x,count:0,cool:0,items:[],t:0,groove:0,lastTap:0,gaps:[]};
  R.state='play';R.tx=R.x;
  const P0=R.play;
  if(['throw','wand','music','stack','book','scope','globe','ride'].includes(mode)){P0.el=toyEl(id);if(mode==='wand'){P0.y=g.floor-g.h*1.8;P0.st='hang'}}
  if(mode==='wand'){P0.str=document.createElement('div');P0.str.className='wand-str';room.appendChild(P0.str)}
  if(mode==='music'||mode==='book'||mode==='scope'||mode==='globe'){P0.x=clamp(g.px+(R.x>.5?-1:1)*L.size*.55,r+10,L.W-r-10);P0.y=g.floor-r;P0.r=r*1.25}
  if(mode==='stack'){P0.x=clamp(g.px+(R.x>.5?-1:1)*L.size*.6,r+10,L.W-r-10);P0.stack=[];P0.el.style.opacity='0'}
  if(mode==='ride'){P0.x=g.px;P0.y=g.floor-r*.5;P0.r=r*1.1}
  const bar=$('#playBar');bar.hidden=false;{const hb=$('#roomHud').getBoundingClientRect(),rb=room.getBoundingClientRect();bar.style.top=(hb.bottom-rb.top+6)+'px'}bar.querySelector('.pb-txt').textContent=TOY_HINT[mode];bar.querySelector('.pb-ico').innerHTML=iconOf(id);
  setToolOn('toys',true);SFX.pop();
  const it=ITEM[id];if(mode==='throw')say(pick([`Throw the ${it.name.toLowerCase()}!`,'Ready? Throw it!']));
  hudHide(true);
}
function exitPlay(quiet){
  const P0=R.play;if(!P0)return;
  if(P0.el)P0.el.remove();if(P0.str)P0.str.remove();(P0.items||[]).forEach(b=>b.el&&b.el.remove());(P0.stack||[]).forEach(b=>b.el.remove());
  R.play=null;R.state='idle';R.lift=0;R.jv=0;R.skate=false;$('#playBar').hidden=true;setToolOn('toys',false);hudHide(false);room.classList.remove('is-night');
  if(!quiet){SFX.pop();save()}
}
function hudHide(h){$('#thought').style.visibility=h?'hidden':''}
$('#playDone').onclick=()=>{audioInit();exitPlay()};

/* pointer input while playing */
function rXY(e){const r=room.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
room.addEventListener('pointerdown',e=>{
  const P0=R.play;if(!P0||scene!=='room')return;
  if(e.target.closest('.hud,.toolbar,.tray,#playBar,button'))return;
  audioInit();const {x,y}=rXY(e);P0.ptr={id:e.pointerId,x,y,x0:x,y0:y,t0:now()};P0.samples=[{x,y,t:now()}];
  try{room.setPointerCapture(e.pointerId)}catch(_){}
  (PLAY[P0.mode].down||(()=>{}))(P0,x,y,e);
},true);
room.addEventListener('pointermove',e=>{
  const P0=R.play;if(!P0||!P0.ptr||e.pointerId!==P0.ptr.id)return;const {x,y}=rXY(e);
  P0.ptr.x=x;P0.ptr.y=y;P0.samples.push({x,y,t:now()});P0.samples=P0.samples.filter(s=>now()-s.t<110);
  (PLAY[P0.mode].move||(()=>{}))(P0,x,y);
});
const playUp=e=>{const P0=R.play;if(!P0||!P0.ptr||e.pointerId!==P0.ptr.id)return;const {x,y}=rXY(e);(PLAY[P0.mode].up||(()=>{}))(P0,x,y);P0.ptr=null};
room.addEventListener('pointerup',playUp);room.addEventListener('pointercancel',playUp);
function flingV(P0){const s=P0.samples;if(s.length<2)return {vx:0,vy:0};const a=s[0],b=s[s.length-1],dt=Math.max(.016,(b.t-a.t)/1000);return {vx:(b.x-a.x)/dt,vy:(b.y-a.y)/dt}}
const nearToy=(P0,x,y,k=1.9)=>Math.hypot(x-P0.x,y-P0.y)<P0.r*k;

const PLAY={
 throw:{
  down(P0,x,y){if(P0.st==='carried'){temp('giggle',700);babble(P(),'happy',2)}P0.st='held';P0.x=x;P0.y=Math.min(y,petGeo().floor-P0.r);P0.vx=P0.vy=0},
  move(P0,x,y){if(P0.st!=='held')return;const g=petGeo();P0.x=clamp(x,P0.r,L.W-P0.r);P0.y=clamp(y,P0.r+40,g.floor-P0.r)},
  up(P0,x,y){if(P0.st!=='held')return;const u=L.H/800;let {vx,vy}=flingV(P0);const sp=Math.hypot(vx,vy),mx=2600*u;if(sp>mx){vx*=mx/sp;vy*=mx/sp}
   P0.vx=vx;P0.vy=vy;P0.st='air';P0.home=x;P0.thrown=sp>220;if(P0.thrown){SFX.whoosh();temp('happy',800);anim(petAnim,'a-bounce',500)}},
  tick(P0,dt){
   const u=L.H/800,g=2300*u,G=petGeo(),ph=TOY_PHYS[P0.id]||[.6,.5],fl=G.floor-P0.r;
   if(P0.st==='air'){P0.vy+=g*dt;P0.x+=P0.vx*dt;P0.y+=P0.vy*dt;P0.rot+=P0.vx*dt/P0.r;
    if(P0.x<P0.r){P0.x=P0.r;P0.vx=Math.abs(P0.vx)*ph[0]}if(P0.x>L.W-P0.r){P0.x=L.W-P0.r;P0.vx=-Math.abs(P0.vx)*ph[0]}

/* ================= FAMILY CODES: move Gibbis to another device, no account ================= */
const ON_SITE=!/claude|anthropic/i.test(location.hostname);
const SITE_URL='https://gibbi-games.github.io/Gibbi-Games/gibbis/';
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function packSave(){
  const s=JSON.parse(JSON.stringify(S));delete s.decks;let bytes=new TextEncoder().encode(JSON.stringify(s));
  try{if(window.CompressionStream){const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(bytes);w.close();return 'G1'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}}catch(e){}
  return 'G0'+b64u(bytes);
}
async function unpackSave(code){
  code=String(code||'').trim().replace(/^.*[#&]fc=/,'').replace(/\s+/g,'');
  const kind=code.slice(0,2),body=unb64u(code.slice(2));let bytes=body;
  if(kind==='G1'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(body);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  else if(kind!=='G0')throw new Error('bad');
  const obj=JSON.parse(new TextDecoder().decode(bytes));if(!obj||!Array.isArray(obj.pets))throw new Error('bad');return obj;
}
function familyHTML(){
  return `<div><h3>Move to another device</h3>
    <p class="note" style="text-align:left;margin-bottom:8px">Make a Family Code here, then open it on the new phone or tablet. Your Gibbis, coins and items come along. No account needed.</p>
    <div class="fam-btns"><button class="fam-b" id="famMake">Make a Family Code</button><button class="fam-b alt" id="famUse">Use a Family Code</button></div>
    <div id="famBox"></div></div>`;
}
function wireFamily(){
  const box=$('#famBox');if(!box)return;
  $('#famMake').onclick=async()=>{SFX.pop();box.innerHTML=`<p class="note" style="text-align:left">Making your code…</p>`;
    const code=await packSave();const link=SITE_URL+'#fc='+code;
    box.innerHTML=`<textarea class="fam-code" id="famCode" readonly aria-label="Family Code"></textarea><div class="fam-btns">${navigator.share?`<button class="fam-b" id="famShare">Send link</button>`:''}<button class="fam-b alt" id="famCopy">Copy link</button></div><p class="note" style="text-align:left;margin-top:6px">Open the link on the new device. Anyone with it can copy your Gibbis, so only send it to yourself or family.</p>`;
    $('#famCode').value=link;
    $('#famCopy').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('star','Link copied!')}catch(e){const t=$('#famCode');t.focus();t.select();toast('star','Selected. Copy it from the menu.')}};
    const sh=$('#famShare');if(sh)sh.onclick=async()=>{try{await navigator.share({title:'My Gibbis',text:'Open this to bring my Gibbis to this device:',url:link})}catch(e){}};
  };
  $('#famUse').onclick=()=>{SFX.pop();box.innerHTML=`<textarea class="fam-code" id="famIn" placeholder="Paste a Family Code or link" aria-label="Paste a Family Code"></textarea><div class="fam-btns"><button class="fam-b" id="famLoad">Load Gibbis</button></div>`;
    $('#famLoad').onclick=async()=>{try{const obj=await unpackSave($('#famIn').value);askImport(obj)}catch(e){toast('star',"That code didn't work. Check that you copied all of it.")}}};
}
function askImport(obj){
  closeSettings();show('title');const box=$('#titleActions');
  const n=obj.pets.length,best=obj.pets.reduce((a,p)=>p.level>a.level?p:a,obj.pets[0]);
  $('#title .title-wrap').classList.remove('back');const egg=$('#titleEgg');egg.classList.add('has-pet');egg.innerHTML=`<div class="hero-pet">${scaled(best,'happy',.8)}</div>`;
  box.innerHTML=`<p class="note big" id="impNote"></p><div class="confirm wide"><button class="no" id="impNo">Not now</button><button class="yes" id="impYes" style="background:var(--mint);color:var(--ink)">Load them</button></div>`;
  $('#impNote').textContent=`Load ${n} Gibbi${n===1?'':'s'} (${best.name}, level ${best.level}) onto this device?${S&&S.pets&&S.pets.length?` This replaces the ${S.pets.length} here.`:''}`;
  $('#impNo').onclick=()=>{SFX.pop();renderTitle()};
  $('#impYes').onclick=()=>{audioInit();S=normalize(migrate(obj));S.savedAt=Date.now();save();SFX.chime();toast('star','Your Gibbis are here!');renderTitle()};
}
async function checkFamilyLink(){
  const m=location.hash.match(/[#&]fc=([A-Za-z0-9_-]+)/);if(!m)return false;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  try{const obj=await unpackSave(m[1]);askImport(obj);return true}catch(e){toast('star',"That Family Code link didn't work.");return false}
}

window.addEventListener('keydown',e=>{

/* main loop */
let last=now(),saveT=5;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  B.t=Math.min(20,B.t+dt*.67);for(const k in B.fat)B.fat[k]=Math.max(0,B.fat[k]-dt*.015);
  const p=P();
  if(p&&p.name&&!document.hidden&&['room','school','bus','arcade','game','shop'].includes(scene)){
    needsTick(dt);
    if(scene==='room')roomTick(dt);else if(scene==='game')gameTick(dt);
    saveT-=dt;if(saveT<=0){saveT=5;save()}
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=now()});

/* migration */
function migrate(s){
  if(!s)return null;
  if(s.v===2&&Array.isArray(s.pets))return s;
  if(s.v===1){
    const out={v:2,mode:s.mode||'creative',pets:[],cur:0,eggs:0,eggMeter:0,grade:0,secrets:s.secrets||[],settings:{sfx:true,music:true,fast:false,...(s.settings||{})},stats:s.stats||{catches:0,air:0,best:0},teacher:randGenes()};
    const o=s.pet;
    if(o){
      const p={id:'p'+Date.now().toString(36),name:o.name||'',hue:o.hue,genes:o.genes,species:o.species,level:1,xp:0,day:today(),dayXp:0,marks:[],pts:{...zeroPts(),...(o.pts||{})},lv:zeroPts(),fav:o.fav||'berry',dis:o.dis||'chili',needs:o.needs||{food:80,energy:80,clean:80,fun:80},sick:!!o.sick,sickT:0,born:o.born||Date.now(),school:Object.fromEntries(SUBJECTS.map(k=>[k,{c:0,st:0}]))};
      genesOf(p);
      if(o.stage>0){p.level=4;p.marks=o.path?[o.path,o.path,o.path]:[];p.rev=null}
      else{p.rev=[];p.revOrder=revealOrder(p.genes)}
      out.pets.push(p);
    }else out.eggs=1;
    return out;
  }
  return null;
}

  L2.innerHTML=Array.from({length:d.n},(_,i)=>{const r=Math.random;

function floorBand(){const top=L.H*.66+6,bot=L.H-L.bottom*.5;return {top,bot,pet:clamp((L.H-L.bottom-top)/(bot-top),0,1)}}
function layoutHome(){
  if(!L.W)return;const h=ensureHome();const fb=floorBand();const wallH=L.H*.66;
  h.items.forEach(i=>{const it=ITEM[i.id];const el=document.querySelector(`.deco-i[data-u="${i.u}"]`);if(!it||!el)return;const m=mountOf(it);
    const hh=(it.s||.5)*L.size,ww=hh*(it.ar||1);
    if(m==='rug'){const w=(it.s||1.5)*L.size*(.7+.4*i.d);const y=fb.top+i.d*(fb.bot-fb.top);
      Object.assign(el.style,{width:w+'px',height:w*(it.sq||it.hex?.36:.34)+'px',left:(i.x*L.W)+'px',top:y+'px',zIndex:1});return}
    if(m==='floor'){const sc=.72+.4*i.d;const y=fb.top+i.d*(fb.bot-fb.top);
      Object.assign(el.style,{width:ww*sc+'px',height:hh*sc+'px',left:(i.x*L.W)+'px',top:y+'px',zIndex:i.d>fb.pet?4:2,fontSize:hh*sc*.92+'px'});return}
    // wall + ceiling
    Object.assign(el.style,{width:ww+'px',height:hh+'px',left:(40+i.x*L.W)+'px',top:(i.y*wallH)+'px',fontSize:hh*.92+'px'});
    if(m==='ceil')el.style.setProperty('--cord',(i.y*wallH-hh/2)+'px');
  });
  if(DECO.sel)placeSelBar();
}

// The room follows the real clock: soft morning, bright day, warm evening, cozy night. Lamps glow on their own after dark.
let TOD={k:'',wx:'',chk:0};
function todOf(h){return h>=6&&h<10?'morning':h>=10&&h<17?'day':h>=17&&h<20?'evening':'night'}
function weatherNow(d){
  // a little weather now and then, the same for everyone in the same hour
  const seed=(d.getFullYear()*400+d.getMonth()*32+d.getDate())*24+d.getHours();const r=((Math.sin(seed*12.9898)*43758.5453)%1+1)%1;
  if(r<.16)return [11,0,1].includes(d.getMonth())?'snow':'rain';return '';
}
function todTick(dt,force){
  TOD.chk-=dt;if(TOD.chk>0&&!force)return;TOD.chk=20;
  const d=new Date();const k=todOf(d.getHours()),wx=weatherNow(d);const room=$('#room');
  if(k!==TOD.k||force){['morning','day','evening','night'].forEach(x=>room.classList.toggle('tod-'+x,x===k));TOD.k=k}
  if(wx!==TOD.wx||force){const w=$('#room .window .wx');if(w)w.className='wx'+(wx?' '+wx:'');TOD.wx=wx}
}

function fromMini(m){return {name:m.n,genes:m.g,level:m.L||1,marks:m.m||[],wear:m.w||{},rev:m.r||null,id:m.id,sick:false}}
async function packObj(o){const bytes=new TextEncoder().encode(JSON.stringify(o));
  try{if(window.CompressionStream){const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(bytes);w.close();return 'B1'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}}catch(e){}
  return 'B0'+b64u(bytes)}
async function unpackObj(code){const kind=code.slice(0,2),body=unb64u(code.slice(2));let bytes=body;
  if(kind==='B1'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(body);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}else if(kind!=='B0')throw new Error('bad');
  return JSON.parse(new TextDecoder().decode(bytes))}

}

// ---- babies together ----
function mixGenes(a,b){
  const pk=k=>Math.random()<.5?a[k]:b[k];const g={};
  ['ears','tail','wings','pattern','body','eyes','patchSide','spots'].forEach(k=>g[k]=JSON.parse(JSON.stringify(pk(k))));
  const hm=(x,y)=>{let d=((y-x+540)%360)-180;return Math.round((x+d*rand(.3,.7)+rand(-12,12)+360)%360)};
  g.h=hm(a.h,b.h);g.bh=hm(a.bh,b.bh);g.ah=hm(a.ah,b.ah);g.s=Math.round((a.s+b.s)/2);g.l=Math.round((a.l+b.l)/2);
  g.es=+(((a.es||1)+(b.es||1))/2).toFixed(2);g.eg=Math.round(((a.eg||22)+(b.eg||22))/2);
  const ex=[...new Set([...(a.extras||[]),...(b.extras||[])])];g.extras=shuffle(ex).slice(0,2);
  return g;
}
function babyWith(f){
  const p=P();const day=24*3600*1000;
  if(p.level<3){SFX.boop();toast('star',`${p.name} needs to reach level 3 first.`);return}
  if(f.baby&&Date.now()-f.baby<day){SFX.boop();toast('star','One baby egg per friend each day. Come back tomorrow!');return}
  f.baby=Date.now();S.babies=S.babies||[];S.babies.push({g:mixGenes(genesOf(p),f.pet.g),a:p.name,b:f.name});S.eggs=(S.eggs||0)+1;save();
  SFX.level();say(`A baby egg from ${p.name} and ${f.name}!`);toast('star','A baby egg is in your nest!');
}

}
function duck(on){if(DUCK)try{DUCK.gain.setTargetAtTime(on?.2:1,AC.currentTime,on?.08:.4)}catch(e){}}
function osc(f,t,d,type,vol,dest,to){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
function hiss(t,d,vol,freq,dest,type='bandpass'){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.02);
}
// one sung Gibberish syllable: a little scoop into the note, open vowel, vibrato that blooms as it holds
function singNote(f,t,d,dest,i){
  const v=VOWELS[(i*3+1)%VOWELS.length];
  const o=AC.createOscillator(),body=AC.createOscillator(),vib=AC.createOscillator(),vg=AC.createGain();
  const f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),mix=AC.createGain(),gn=AC.createGain(),bg=AC.createGain();
  o.type='sawtooth';body.type='sine';
  for(const x of [o,body]){x.frequency.setValueAtTime(f*.93,t);x.frequency.exponentialRampToValueAtTime(f,t+.06)}
  vib.frequency.value=5.6;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(0,t+Math.min(.15,d*.4));vg.gain.linearRampToValueAtTime(f*.022,t+d);
  vib.connect(vg);vg.connect(o.frequency);vg.connect(body.frequency);
  f1.type='bandpass';f1.frequency.value=v[0]*1.2;f1.Q.value=5;f2.type='bandpass';f2.frequency.value=v[1]*1.2;f2.Q.value=7;
  o.connect(f1);o.connect(f2);f1.connect(mix);f2.connect(mix);mix.gain.value=.85;mix.connect(gn);body.connect(bg);bg.gain.value=.18;bg.connect(gn);
  const end=t+Math.max(.12,d);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.5,t+.03);gn.gain.setValueAtTime(.42,end-.07);gn.gain.exponentialRampToValueAtTime(.0001,end);
  gn.connect(dest);for(const x of [o,body,vib]){x.start(t);x.stop(end+.05)}
  if(i%2===0)hiss(t,.03,.12,3200,dest,'highpass');
}
function stopSong(){
  if(!SONG)return;const s=SONG;SONG=null;s.timers.forEach(clearTimeout);duck(false);
  if(s.g){try{s.g.gain.setTargetAtTime(0,AC.currentTime,.04)}catch(e){}setTimeout(()=>{try{s.g.disconnect()}catch(e){}},500)}
  s.onEnd&&s.onEnd(true);
}
const NOTE_C=c=>`<svg viewBox="0 0 24 26"><path d="M9 19a3.4 3.4 0 1 1-2.2-3.2V4.5l11-2.3v13a3.4 3.4 0 1 1-2.2-3.2V7L9 8.4z" fill="${c}" stroke="#121417" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function singVis(d,s){
  if(scene!=='room')return;
  temp('sing',Math.max(160,d*880));anim(petAnim,'a-sing',Math.min(650,d*1000));
  const c=petCenter();const col=SING_COL[((s%12)+12)%12%SING_COL.length];
  spawn(NOTE_C(col),c.x+rand(-c.w*.45,c.w*.45),c.top+10,'float',1500,{dx:rand(-40,40),size:rand(24,32)});
}
// tune: [[semitones, beats]...]; inst: 'piano' | 'radio' | 'drums' | null
function singTune(p,tune,opt={}){
  stopSong();
  const id=++songN;const beat=60/(opt.bpm||112);const base=singBase(p);
  const sound=AC&&S&&S.settings.sfx;const g=sound?songOut():null;const t0=sound?AC.currentTime+.1:0;
  const timers=[];let at=0;
  if(sound)duck(true);
  tune.forEach(([s,b],i)=>{
    const d=b*beat;const f=base*Math.pow(2,s/12);
    if(sound){
      singNote(f,t0+at,d*.9,g,i);
      if(opt.inst==='piano'){osc(f*2,t0+at,Math.min(1.2,d*1.4),'triangle',.16,g);osc(f*4,t0+at,.25,'sine',.04,g)}
      if(opt.inst==='radio')osc(f*2,t0+at,d*.85,'square',.035,g);
    }
    timers.push(setTimeout(()=>{if(!SONG||SONG.id!==id)return;singVis(d,s);opt.onNote&&opt.onNote(i,s)},(at+.1)*1000));
    at+=d;
  });
  if(sound&&opt.inst){
    const beats=Math.ceil(at/beat);
    for(let k=0;k<beats;k++){const t=t0+k*beat;
      if(opt.inst==='drums'){if(k%2===0)osc(140,t,.18,'sine',.5,g,45);else hiss(t,.12,.35,1800,g);hiss(t+beat/2,.04,.12,7000,g,'highpass')}
      if(opt.inst==='radio'){osc(base/2*Math.pow(2,([0,0,7,5][k%4])/12),t,beat*.8,'triangle',.2,g);hiss(t+beat/2,.03,.08,6000,g,'highpass')}
      if(opt.inst==='piano'&&k%2===0)osc(base/2,t,beat*1.8,'triangle',.08,g);
    }
  }
  timers.push(setTimeout(()=>{if(!SONG||SONG.id!==id)return;const s=SONG;SONG=null;duck(false);if(s.g)setTimeout(()=>{try{s.g.disconnect()}catch(e){}},1500);opt.onEnd&&opt.onEnd(false)},(at+.25)*1000));
  SONG={id,g,timers,onEnd:opt.onEnd};
  return at;
}
// on its own: a happy, well-cared-for Gibbi hums a little song now and then
function happySing(){
  if(scene!=='room'||DECO.on||R.state!=='idle'||SONG||PAD.on||R.play)return false;
  const p=P();if(isSad())return false;
  if(S.mode==='survival'&&Object.values(p.needs).some(v=>v<55))return false;
  R.singing=true;
  singTune(p,pick(TUNES),{bpm:rand(104,128),onEnd:()=>{R.singing=false}});
  return true;
}
// along with the radio, drum kit, keyboard or disco ball
const SING_INST={'f-radio':'radio','f-drums':'drums','f-piano':'piano','l-disco':'radio'};
function singAlong(id){return singTune(P(),pick(TUNES),{inst:SING_INST[id]||'radio',bpm:rand(108,126)})}

/* ---------- Copy my tune: tap the bells, your Gibbi sings it back ---------- */
const PAD={on:false,notes:[],last:0,wait:null,busy:false};
function bellTone(s){if(!AC||!S.settings.sfx)return;const f=523.25*Math.pow(2,s/12);tone(f,.7,'triangle',.24);tone(f*2,.35,'sine',.07);tone(f*3,.15,'sine',.03)}
function padHTML(){
  return `<div class="pad-card"><div class="pad-top"><b>Tap a song!</b><button class="pad-x" id="padX" aria-label="Close">×</button></div>
  <div class="bells">${BELLS.map((s,i)=>`<button class="bell" data-i="${i}" style="--bc:${SING_COL[i]}" aria-label="Bell ${i+1}"><i></i></button>`).join('')}</div>
  <div class="pad-dots" id="padDots"></div></div>`;
}
function openPad(){
  if(scene!=='room'||DECO.on)return;audioInit();stopSong();
  if(R.state==='use')endUse(true);
  PAD.on=true;PAD.notes=[];PAD.busy=false;const el=$('#singPad');el.innerHTML=padHTML();el.hidden=false;$('#room').classList.add('padding');
  R.tx=.5;if(R.state==='idle')R.state='walk';
  $('#padX').onclick=e=>{e.stopPropagation();SFX.tap();closePad()};
  el.querySelectorAll('.bell').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();padTap(+b.dataset.i,b)}));
  padDots();say('Tap the bells, and I will sing it back!');
}
function closePad(){
  PAD.on=false;clearTimeout(PAD.wait);stopSong();const el=$('#singPad');el.hidden=true;el.innerHTML='';$('#room').classList.remove('padding');
}
function padDots(){const d=$('#padDots');if(d)d.innerHTML=Array.from({length:8},(_,i)=>`<i style="${PAD.notes[i]?`background:${SING_COL[PAD.notes[i].i]}`:''}"></i>`).join('')}
function padTap(i,b){
  if(PAD.busy)return;audioInit();bellTone(BELLS[i]);anim(b,'ring',350);
  const t=now();const gap=PAD.notes.length?clamp((t-PAD.last)/1000,.2,.9):.4;PAD.last=t;
  if(PAD.notes.length)PAD.notes[PAD.notes.length-1].b=gap;
  PAD.notes.push({i,b:.5});padDots();
  if(scene==='room'){temp('happy',900);const c=petCenter();spawn(NOTE_C(SING_COL[i]),b.getBoundingClientRect().left+b.offsetWidth/2,b.getBoundingClientRect().top,'float',1000,{dx:rand(-20,20),size:24})}
  clearTimeout(PAD.wait);
  if(PAD.notes.length>=8)PAD.wait=setTimeout(padSing,700);else PAD.wait=setTimeout(padSing,1500);
}
function padSing(){
  if(!PAD.on||!PAD.notes.length)return;PAD.busy=true;$('#singPad').classList.add('listening');const hb=$('#singPad .pad-top b');if(hb)hb.textContent='Listen!';
  const notes=PAD.notes.slice();const tune=notes.map(n=>[BELLS[n.i],n.b/(60/112)]);
  const bells=[...document.querySelectorAll('#singPad .bell')];
  singTune(P(),tune,{bpm:112,onNote:k=>{const b=bells[notes[k].i];if(b)anim(b,'lit',380)},onEnd:cut=>{
    $('#singPad').classList.remove('listening');PAD.busy=false;{const hb=$('#singPad .pad-top b');if(hb)hb.textContent='Tap a song!'}PAD.notes=[];padDots();
    if(cut||!PAD.on)return;const c=petCenter();hearts(c.x,c.top,3);anim(petAnim,'a-jump',700);temp('giggle',1200);
    addNeed('fun',6);gain('sweet',1);save();
  }});
}

$('#singBtn').innerHTML=NOTE_C('#1BBEEE');
$('#singBtn').addEventListener('click',()=>{if(scene!=='room'||DECO.on)return;SFX.tap();PAD.on?closePad():openPad()});
$('#decoBtn').addEventListener('click',()=>{if(PAD.on)closePad()});

function start(data){
  S=normalize(migrate(data&&data.S)||migrate(load()));
  if(data&&data.S)CLOUD.state=data.cloud||'checking';
  try{window.claude?.hot?.snapshot?.(()=>({S,cloud:CLOUD.state}))}catch(_){}
  const p=P();
  if(p&&!p.name){show('hatch');$('#eggBtn').hidden=true;$('#tapRing').hidden=true;const hp=$('#hatchPet');hp.innerHTML=scaled(p,'happy',.62);hp.hidden=false;showNamer()}
  else{show('title');renderTitle()}
  requestAnimationFrame(frame);
  cloudInit();
  checkFamilyLink();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
